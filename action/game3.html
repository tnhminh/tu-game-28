<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bắn Zombie Sinh Tồn</title>
<style>
:root{--bg:#0b0e09;--bgimg:radial-gradient(110% 80% at 50% 0%,#1d2618 0%,#0d110b 55%,#050604 100%);--acc:#b6f05a;--accd:#1e3300;--txt:#e4ecd8;--mut:#9aa88a;--good:#ffd166;--p1:#232b1c;--p2:#12160e;--ovbg:radial-gradient(ellipse at 50% 40%,rgba(40,10,10,.3),rgba(4,5,3,.88));--b1:#d4ff7a;--b2:#8fd13a;--b3:#3e6a0e;--ink:#132000;--s1:#4d5c3c;--s2:#36412a;--s3:#1c2414;--logo:linear-gradient(180deg,#f4ffd8 0%,#b6f05a 45%,#5a8a1a 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);background-image:var(--bgimg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#back{position:fixed;top:5px;left:8px;z-index:60;color:var(--acc);text-decoration:none;font-size:13px;font-weight:600;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#back:hover{background:rgba(0,0,0,.75)}
#pauseBtn{position:fixed;top:5px;right:8px;z-index:60;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:8px;font:700 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:5px 11px;cursor:pointer;display:none;transition:background .15s}
#pauseBtn:hover{background:rgba(0,0,0,.8)}
#stage{position:absolute;left:0;top:0;border-radius:8px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 10px 40px rgba(0,0,0,.6)}
canvas{display:block;width:100%;height:100%;border-radius:8px}
#ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--ovbg);padding:38px 12px 12px;overflow:auto;animation:ovin .3s ease-out}
@keyframes ovin{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.panel{position:relative;background:linear-gradient(180deg,var(--p1),var(--p2));border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:20px 20px 16px;max-width:540px;width:100%;text-align:center;box-shadow:0 0 0 4px rgba(0,0,0,.3),0 0 0 5px var(--accd),0 24px 60px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.14);max-height:100%;overflow:auto;animation:pop .38s cubic-bezier(.2,1.3,.4,1)}
.panel:before{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;background:radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.10),transparent 60%)}
.panel h1{font-size:30px;font-weight:900;letter-spacing:-.3px;color:var(--acc);margin-bottom:6px;text-shadow:0 3px 0 var(--accd),0 6px 16px rgba(0,0,0,.45);line-height:1.15}
.panel h2{font-size:23px;font-weight:900;color:var(--acc);margin-bottom:8px;text-shadow:0 2px 0 var(--accd)}
.panel p{font-size:14px;line-height:1.5;margin:6px 0;color:var(--txt)}
.panel ul{text-align:left;font-size:13px;line-height:1.55;margin:8px 0 8px 18px;color:var(--txt)}
.panel .sub{color:var(--mut);font-size:13px}
.logo{display:block;font-size:36px;font-weight:900;line-height:1.05;letter-spacing:-.5px;margin:2px 0 6px;background:var(--logo);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 var(--accd)) drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.kicker{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.btn{position:relative;display:inline-block;margin:5px;padding:11px 20px;font:800 15px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;border:none;border-radius:12px;background:linear-gradient(180deg,var(--b1),var(--b2));color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--b3),0 8px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.08) saturate(1.05);transform:translateY(-1px);box-shadow:0 5px 0 var(--b3),0 10px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.55)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--b3),0 3px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.btn:focus-visible,.tg:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn.s{background:linear-gradient(180deg,var(--s1),var(--s2));color:#fff;box-shadow:0 3px 0 var(--s3),0 6px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.2);padding:8px 13px;font-size:13px}
.btn.s:hover{box-shadow:0 4px 0 var(--s3),0 8px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.s:active{box-shadow:0 1px 0 var(--s3)}
.btn[disabled]{opacity:.38;filter:grayscale(.6);cursor:default;transform:none}
.hs{color:var(--good);font-weight:800}
.opts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0 2px}
.tg{font:700 12px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.16);color:var(--mut);cursor:pointer;transition:all .15s}
.tg:hover{border-color:rgba(255,255,255,.4);color:#fff}
.tg.on{color:#fff;background:rgba(255,255,255,.12);border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:12px 0}
.st{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:9px 6px 8px}
.st b{display:block;font-size:22px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;line-height:1.1}
.st small{display:block;color:var(--mut);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.st.hl b{color:var(--acc)}
.help{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;text-align:left;font-size:13px;line-height:1.4;color:var(--txt);margin:12px 0;background:rgba(0,0,0,.22);border-radius:12px;padding:10px 12px;border:1px solid rgba(255,255,255,.07)}
.help>span:nth-child(odd){color:var(--acc);font-weight:800;white-space:nowrap}
kbd{display:inline-block;min-width:18px;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-bottom-width:2px;font:700 11px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;text-align:center}
.rec{display:inline-flex;gap:14px;justify-content:center;font-size:13px;color:var(--mut);margin:4px 0 8px}
.rec b{color:var(--good)}
.newrec{display:inline-block;margin:2px 0 4px;padding:3px 10px;border-radius:999px;background:var(--good);color:#082010;font-weight:900;font-size:12px;letter-spacing:.06em;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){#ov,.panel,.newrec{animation:none}}
@media (max-width:420px){.help{grid-template-columns:1fr;gap:1px 0}.help>span:nth-child(odd){margin-top:6px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}.help>span:first-child{margin-top:0}.panel{padding:16px 13px 12px}.logo{font-size:30px}.panel h1{font-size:25px}.btn{padding:10px 16px}}

.panel{border-color:rgba(182,240,90,.28);background-image:linear-gradient(180deg,var(--p1),var(--p2)),repeating-linear-gradient(45deg,rgba(255,255,255,.015) 0 8px,transparent 8px 16px)}
.panel h1{color:#ff5a4a;text-shadow:0 3px 0 #3a0000,0 6px 16px rgba(0,0,0,.5)}
canvas{cursor:none}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.it{position:relative;display:flex;gap:9px;align-items:flex-start;background:linear-gradient(180deg,#2f3a26,#232c1c);border:1px solid #4f6340;border-radius:11px;padding:8px;text-align:left;cursor:pointer;color:#fff;font-size:12px;line-height:1.35;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .08s,border-color .15s,filter .15s;font-family:inherit}
.it img{width:40px;height:40px;flex:none;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08)}
.it b{display:block;font-size:13px;color:#d9ff9c;margin-bottom:1px}
.it .c{display:inline-block;margin-top:3px;color:#ffd166;font-weight:900;background:rgba(0,0,0,.3);padding:1px 7px;border-radius:999px}
.it:hover:not([disabled]){transform:translateY(-2px);border-color:#b6f05a;filter:brightness(1.1)}
.it:active:not([disabled]){transform:translateY(2px)}
.it[disabled]{opacity:.42;cursor:default;filter:grayscale(.5)}
.it.own{border-color:#ffd166;background:linear-gradient(180deg,#3d3a20,#2a2816)}
.pips{display:flex;gap:2px;margin-top:4px}.pips i{width:8px;height:4px;border-radius:1px;background:rgba(255,255,255,.14)}.pips i.on{background:#b6f05a}
.coinbar{display:inline-flex;gap:12px;align-items:center;background:rgba(0,0,0,.3);padding:6px 14px;border-radius:999px;font-size:13px;color:var(--mut)}
.coinbar b{color:#ffd166;font-size:16px}
#tc{display:none}
body.touch #tc{display:block}
.joy{position:fixed;bottom:24px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.04) 30%,rgba(255,255,255,.12));border:2px solid rgba(255,255,255,.28);box-shadow:inset 0 0 20px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.4);z-index:40;touch-action:none}
.joy:before{content:"";position:absolute;inset:14px;border-radius:50%;border:1px dashed rgba(255,255,255,.14)}
.joy .k{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;border:2px solid rgba(255,255,255,.6);pointer-events:none;box-shadow:0 4px 10px rgba(0,0,0,.5)}
#jL{left:16px}#jL .k{background:radial-gradient(circle at 40% 35%,#e4ffb0,#8fd13a 70%)}
#jR{right:16px;border-color:rgba(255,107,107,.45)}#jR .k{background:radial-gradient(circle at 40% 35%,#ffc0b0,#e0483a 70%)}
.jl{position:absolute;bottom:-18px;width:100%;text-align:center;font-size:11px;font-weight:700;color:#ccc;text-shadow:0 1px 2px #000}
#bW{position:fixed;right:160px;bottom:40px;z-index:40;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.22),rgba(255,255,255,.06));border:2px solid rgba(255,209,102,.5);box-shadow:0 4px 0 rgba(0,0,0,.35);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;touch-action:none}
#bW:active{transform:scale(.94)}
</style>
</head>
<body>
<a id="back" href="../index.html">← Danh sách game</a>
<button id="pauseBtn">⏸ Dừng</button>
<div id="stage"><canvas id="c" width="640" height="360"></canvas></div>
<div id="tc"><div class="joy" id="jL"><div class="k"></div><div class="jl">Di chuyển</div></div><div class="joy" id="jR"><div class="k"></div><div class="jl">Ngắm &amp; bắn</div></div><div id="bW">Đổi<br>súng</div></div>
<div id="ov"></div>
<script>
(function(){
'use strict';
const W=640,H=360,AW=1400,AH=1000;
let RS=1;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),stage=document.getElementById('stage'),pauseBtn=document.getElementById('pauseBtn');
function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function ghEmit(type, data){try{if(window.parent&&window.parent!==window)window.parent.postMessage(Object.assign({gh:1,type:type},data||{}),'*')}catch(e){}}
let ghLive=false;function ghEnd(rec){if(!ghLive)return;ghLive=false;ghEmit('end',{score:score,win:null,best:rec});}
let best=load('zom_best',{score:0,wave:0});if(!best||typeof best!=='object')best={score:0,wave:0};let muted=!!load('zom_mute',false);

// ---------- settings ----------
const RM=(function(){try{return !!matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}})();
let fxHi=load('zom_fx','hi')!=='lo',musicOn=load('zom_music',true)!==false;
// no saved choice yet -> pick a default and auto-drop to "Thấp" if the device can't keep up
let fxAuto=load('zom_fx',null)===null,perfAcc=0,perfN=0;
if(fxAuto&&navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=2)fxHi=false;
function perfWatch(dt,playing){if(!fxAuto||!fxHi||!playing||document.hidden)return;perfAcc+=dt;if(++perfN>=150){if(perfAcc/perfN>0.027){fxHi=false;fxAuto=false;}perfAcc=0;perfN=0;}}
// ---------- audio engine (layered Web Audio, music bus with echo) ----------
let ac=null,bus=null,mbus=null,nbuf=null;
function A(){
  if(!ac){const C=window.AudioContext||window.webkitAudioContext;ac=new C();
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.connect(ac.destination);
    bus=ac.createGain();bus.gain.value=1;bus.connect(comp);
    mbus=ac.createGain();mbus.gain.value=0;mbus.connect(comp);
    const dl=ac.createDelay(1),fb=ac.createGain(),wet=ac.createGain(),lp=ac.createBiquadFilter();dl.delayTime.value=0.31;fb.gain.value=0.3;wet.gain.value=0.3;lp.frequency.value=2200;
    mbus.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(wet);wet.connect(comp);
    const n=ac.sampleRate;nbuf=ac.createBuffer(1,n,n);const d=nbuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}
  if(ac.state==='suspended')ac.resume();return ac;}
function tone(f,d,type,vol,slide,o){if(muted)return;try{o=o||{};const a=A(),t=a.currentTime+(o.at||0),os=a.createOscillator(),g=a.createGain(),v=1+(Math.random()-0.5)*(o.vr==null?0.06:o.vr);
  os.type=type||'square';os.frequency.setValueAtTime(f*v,t);if(slide)os.frequency.exponentialRampToValueAtTime(Math.max(30,(f+slide)*v),t+d);if(o.det)os.detune.value=o.det;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol||0.05,t+(o.a||0.004));g.gain.exponentialRampToValueAtTime(0.0005,t+d);
  let n=os;if(o.lp){const fl=a.createBiquadFilter();fl.type=o.ft||'lowpass';fl.frequency.value=o.lp;fl.Q.value=o.q||0.7;os.connect(fl);n=fl;}
  n.connect(g);g.connect(bus);os.start(t);os.stop(t+d+0.05);}catch(e){}}
function noise(d,vol,lp,o){if(muted)return;try{o=o||{};const a=A(),t=a.currentTime+(o.at||0),s=a.createBufferSource(),g=a.createGain(),fl=a.createBiquadFilter();
  s.buffer=nbuf;s.playbackRate.value=0.8+Math.random()*0.4;fl.type=o.ft||'lowpass';fl.frequency.setValueAtTime(lp||2500,t);if(o.sw)fl.frequency.exponentialRampToValueAtTime(o.sw,t+d);fl.Q.value=o.q||0.8;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol||0.08,t+0.003);g.gain.exponentialRampToValueAtTime(0.0005,t+d);s.connect(fl);fl.connect(g);g.connect(bus);s.start(t,Math.random()*0.5);s.stop(t+d+0.05);}catch(e){}}
// music: tiny step sequencer, scheduled ahead on the audio clock
let mStep=0,mNext=0;
function mn(t,f,d,type,vol,lp){try{const os=ac.createOscillator(),g=ac.createGain();os.type=type;os.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0005,t+d);let n=os;if(lp){const fl=ac.createBiquadFilter();fl.frequency.value=lp;os.connect(fl);n=fl;}n.connect(g);g.connect(mbus);os.start(t);os.stop(t+d+0.05);}catch(e){}}
function mz(t,d,vol,f,ft){try{const s=ac.createBufferSource(),g=ac.createGain(),fl=ac.createBiquadFilter();s.buffer=nbuf;fl.type=ft||'highpass';fl.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0005,t+d);s.connect(fl);fl.connect(g);g.connect(mbus);s.start(t,Math.random()*0.5);s.stop(t+d+0.05);}catch(e){}}
function kick(t,v){try{const os=ac.createOscillator(),g=ac.createGain();os.frequency.setValueAtTime(150,t);os.frequency.exponentialRampToValueAtTime(42,t+0.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0005,t+0.16);os.connect(g);g.connect(mbus);os.start(t);os.stop(t+0.2);}catch(e){}}
const NF=n=>440*Math.pow(2,(n-69)/12);
function sdeg(S,i){const m=S.mode;return m[((i%7)+7)%7]+12*Math.floor(i/7);}
function mhash(a,b){let h=(a*2654435761^b*1597334677)>>>0;h=Math.imul(h^(h>>>15),2246822507)>>>0;return (h^(h>>>13))>>>0;}
function musicTick(){if(!ac)return;const want=!muted&&musicOn&&musicWanted();mbus.gain.setTargetAtTime(want?0.55:0,ac.currentTime,0.2);
  if(!want){mNext=0;return;}const now=ac.currentTime;if(mNext<now)mNext=now+0.06;const S=SONG(),spb=60/S.bpm/4;
  while(mNext<now+0.22){songStep(S,mStep++,mNext,spb);mNext+=spb;}}
setInterval(musicTick,50);
window.addEventListener('pointerdown',()=>{if(!muted)A();},true);window.addEventListener('keydown',()=>{if(!muted)A();},true);
// ---------- shared canvas helpers ----------
function mkC(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
function outline(c,col){const g=c.getContext('2d'),w=c.width,h=c.height,id=g.getImageData(0,0,w,h),s=id.data,o=new Uint8ClampedArray(s);
  const r=parseInt(col.slice(1,3),16),gg=parseInt(col.slice(3,5),16),b=parseInt(col.slice(5,7),16);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(s[i+3]>60)continue;
    if((x>0&&s[i-1]>60)||(x<w-1&&s[i+7]>60)||(y>0&&s[i-w*4+3]>60)||(y<h-1&&s[i+w*4+3]>60)){o[i]=r;o[i+1]=gg;o[i+2]=b;o[i+3]=255;}}
  id.data.set(o);g.putImageData(id,0,0);return c;}
function spr(w,h,draw,ol){const c=mkC(w+2,h+2),g=c.getContext('2d');g.translate(1,1);draw((x,y,ww,hh,col)=>{g.fillStyle=col;g.fillRect(x,y,ww,hh);},g);g.setTransform(1,0,0,1,0,0);if(ol)outline(c,ol);return c;}
function whiteOf(c){const o=mkC(c.width,c.height),g=o.getContext('2d');g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,o.width,o.height);return o;}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
function settingsHTML(){return `<div class="opts"><button class="tg ${muted?'':'on'}" data-a="mute">${muted?'🔇':'🔊'} Âm thanh: ${muted?'Tắt':'Bật'}</button><button class="tg ${musicOn?'on':''}" data-a="music">♪ Nhạc: ${musicOn?'Bật':'Tắt'}</button><button class="tg ${fxHi?'on':''}" data-a="fx">✦ Hiệu ứng: ${fxHi?'Cao':'Thấp'}</button></div>`;}
function animCounters(){if(RM)return;ov.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,t0=performance.now(),dur=700;const st=n=>{const k=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e);if(k<1)requestAnimationFrame(st);};el.textContent='0';requestAnimationFrame(st);});}
// cached glow / vignette sprites (avoid per-frame gradient creation)
const GLOWC={};
function glowS(rgb,a){a=Math.round(Math.max(0,Math.min(1,a))*20)/20;const k=rgb+'|'+a;if(GLOWC[k])return GLOWC[k];const c=mkC(64,64),g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba('+rgb+','+a+')');gr.addColorStop(0.55,'rgba('+rgb+','+(a*0.45)+')');gr.addColorStop(1,'rgba('+rgb+',0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return GLOWC[k]=c;}
function glow(g,rgb,a,x,y,r){if(r<=0||a<=0.02)return;g.drawImage(glowS(rgb,a),x-r,y-r,r*2,r*2);}
function hexRgb(h){return parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16);}
const VIGC={};
function vignette(g,x,y,w,h,inner,col,a){const k=w+'x'+h+inner+col+a;let c=VIGC[k];if(!c){c=VIGC[k]=mkC(w/4,h/4);const q=c.getContext('2d'),gr=q.createRadialGradient(w/8,h/8,Math.min(w,h)/4*inner,w/8,h/8,Math.hypot(w,h)/8);gr.addColorStop(0,'rgba('+col+',0)');gr.addColorStop(1,'rgba('+col+','+a+')');q.fillStyle=gr;q.fillRect(0,0,w/4,h/4);}
  const sm=g.imageSmoothingEnabled;g.imageSmoothingEnabled=true;g.drawImage(c,x,y,w,h);g.imageSmoothingEnabled=sm;}

function newPlayer(){return {x:AW/2,y:AH/2,r:12,hp:100,maxHp:100,speed:150,dmgMul:1,rateMul:1,pierce:0,magnet:60,inv:0,cd:0,ang:0,walk:0,flash:0,regen:0};}

function rnd(a,b){return a+Math.random()*(b-a);}
function startWave(n){
  wave=n;toSpawn=[];const cnt=8+n*4;
  for(let i=0;i<cnt;i++){let t='walker';const r=Math.random();
    if(n>=2&&r<0.25)t='runner';if(n>=3&&r>0.82)t='spitter';if(n>=4&&r>0.93)t='tank';if(n>=5&&r>0.7&&r<0.8)t='boomer';toSpawn.push(t);}

function spawnZombie(t){

  zombies.push({t:t,x:x,y:y,r:d.r,hp:d.hp*sc,maxHp:d.hp*sc,spd:d.spd*(1+Math.min(0.4,(wave-1)*0.025))*rnd(0.9,1.1),dmg:d.dmg,cd:rnd(1,3),flash:0,wob:Math.random()*6,kx:0,ky:0,hitCd:0});

}
function collideObst(o){
  for(const b of OBST){const nx=Math.max(b.x,Math.min(o.x,b.x+b.w)),ny=Math.max(b.y,Math.min(o.y,b.y+b.h));const dx=o.x-nx,dy=o.y-ny,d=Math.hypot(dx,dy);
    if(d<o.r){if(d>0.001){o.x=nx+dx/d*o.r;o.y=ny+dy/d*o.r;}else{const cx=b.x+b.w/2,cy=b.y+b.h/2;if(Math.abs(o.x-cx)/b.w>Math.abs(o.y-cy)/b.h)o.x=o.x<cx?b.x-o.r:b.x+b.w+o.r;else o.y=o.y<cy?b.y-o.r:b.y+b.h+o.r;}}}
  o.x=Math.max(o.r,Math.min(AW-o.r,o.x));o.y=Math.max(o.r,Math.min(AH-o.r,o.y));
}
function inObst(x,y){for(const b of OBST)if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h)return true;return false;}

function update(dt){
  gameT+=dt;if(shake>0)shake-=dt;
  // move
  let mx=jL.x,my=jL.y;if(keys.KeyA)mx-=1;if(keys.KeyD)mx+=1;if(keys.KeyW)my-=1;if(keys.KeyS)my+=1;
  const m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m;}
  P.x+=mx*P.speed*dt;P.y+=my*P.speed*dt;collideObst(P);if(m>0.1)P.walk+=dt*12;
  if(P.inv>0)P.inv-=dt;if(P.flash>0)P.flash-=dt;
  if(P.regen>0&&P.hp<P.maxHp)P.hp=Math.min(P.maxHp,P.hp+P.regen*dt);
  // aim
  let firing=false;
  let ax=0,ay=0;if(keys.ArrowLeft)ax-=1;if(keys.ArrowRight)ax+=1;if(keys.ArrowUp)ay-=1;if(keys.ArrowDown)ay+=1;
  if(jR.on){P.ang=Math.atan2(jR.y,jR.x);firing=Math.hypot(jR.x,jR.y)>0.35;}
  else if(ax||ay){P.ang=Math.atan2(ay,ax);firing=true;}
  else if(mouse.used){P.ang=Math.atan2(mouse.y+cam.y-P.y,mouse.x+cam.x-P.x);firing=mouse.down||keys.Space;}
  else if(keys.Space){firing=true;}
  P.cd-=dt;
  const w=WEAPONS[curW];
  if(firing&&P.cd<=0){
    P.cd=1/(w.rate*P.rateMul);
    for(let i=0;i<w.pellets;i++){const a=P.ang+rnd(-w.spread,w.spread);const sp=w.speed*rnd(0.92,1.05);
      bullets.push({x:P.x+Math.cos(P.ang)*18,y:P.y+Math.sin(P.ang)*18,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,dmg:w.dmg*P.dmgMul,pierce:w.pierce+P.pierce,life:0.9,col:w.col,hit:[]});}
    P.muzzle=0.05;if(gameT-lastShotSnd>0.04){lastShotSnd=gameT;SFX.gun(curW);}
    if(curW===2||curW===3)shake=Math.max(shake,0.08);
  }
  if(P.muzzle>0)P.muzzle-=dt;
  // spawn
  if(toSpawn.length){spawnT-=dt;if(spawnT<=0){const alive=zombies.length;if(alive<30+wave*2){spawnZombie(toSpawn.shift());}spawnT=Math.max(0.18,1.1-wave*0.06)*rnd(0.6,1.2);}}
  // zombies
  for(const z of zombies){
    if(z.dead)continue;z.wob+=dt*6;if(z.flash>0)z.flash-=dt;if(z.hitCd>0)z.hitCd-=dt;
    const dx=P.x-z.x,dy=P.y-z.y,d=Math.hypot(dx,dy)||1;
    let sp=z.spd;if(z.t==='spitter'&&d<220)sp*=-0.4;if(z.t==='boomer'&&d<120)sp*=1.4;
    let vx=dx/d*sp+Math.sin(z.wob*0.7)*8,vy=dy/d*sp+Math.cos(z.wob*0.6)*8;
    z.x+=(vx+z.kx)*dt;z.y+=(vy+z.ky)*dt;z.kx*=Math.pow(0.02,dt);z.ky*=Math.pow(0.02,dt);collideObst(z);
    if(z.t==='spitter'||z.t==='boss'){z.cd-=dt;if(z.cd<=0&&d<380){z.cd=z.t==='boss'?1.6:rnd(2,3);const n=z.t==='boss'?7:1;for(let i=0;i<n;i++){const a=Math.atan2(dy,dx)+(i-(n-1)/2)*0.25;acid.push({x:z.x,y:z.y,vx:Math.cos(a)*190,vy:Math.sin(a)*190,life:2.4});}tone(260,0.1,'triangle',0.04,-120);}}
    if(z.t==='boomer'&&d<z.r+P.r+4){z.hp=0;killZombie(z);continue;}
    if(d<z.r+P.r&&z.hitCd<=0){hurtPlayer(z.dmg);z.hitCd=0.6;}
  }
  // separation
  for(let i=0;i<zombies.length;i++){const a=zombies[i];if(a.dead)continue;for(let j=i+1;j<zombies.length;j++){const b=zombies[j];if(b.dead)continue;const dx=b.x-a.x,dy=b.y-a.y;const mn=a.r+b.r;if(Math.abs(dx)>mn||Math.abs(dy)>mn)continue;const d=Math.hypot(dx,dy)||0.01;if(d<mn){const p=(mn-d)/2,wa=b.r*b.r/(a.r*a.r+b.r*b.r);a.x-=dx/d*p*2*wa;a.y-=dy/d*p*2*wa;b.x+=dx/d*p*2*(1-wa);b.y+=dy/d*p*2*(1-wa);}}}

      b.x+=b.vx*dt/steps;b.y+=b.vy*dt/steps;
      if(inObst(b.x,b.y)||b.x<0||b.y<0||b.x>AW||b.y>AH){b.dead=true;burst(b.x,b.y,'#ccc',3,80);break;}
      for(const z of zombies){if(z.dead||b.hit.includes(z))continue;const dx=z.x-b.x,dy=z.y-b.y;if(dx*dx+dy*dy<(z.r+3)*(z.r+3)){
        z.hp-=b.dmg;z.flash=0.08;b.hit.push(z);const sp=Math.hypot(b.vx,b.vy);const kb=z.t==='boss'||z.t==='tank'?20:90;z.kx+=b.vx/sp*kb;z.ky+=b.vy/sp*kb;burst(b.x,b.y,'#7aa84a',4,100);fxHitZ(z,b);
        texts.push({x:z.x+rnd(-6,6),y:z.y-z.r,s:Math.round(b.dmg)+'',t:0.45,col:'#fff'});
        if(z.hp<=0)killZombie(z);if(b.pierce>0)b.pierce--;else{b.dead=true;break;}}}
    }
    b.life-=dt;if(b.life<=0)b.dead=true;
  }
  bullets=bullets.filter(b=>!b.dead);zombies=zombies.filter(z=>!z.dead);
  for(const a of acid){a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt;if(inObst(a.x,a.y))a.life=0;if(Math.hypot(a.x-P.x,a.y-P.y)<P.r+5){hurtPlayer(8);a.life=0;burst(a.x,a.y,'#9cff6a',6);}}
  acid=acid.filter(a=>a.life>0);
  // pickups
  for(const k of pickups){k.t+=dt;const dx=P.x-k.x,dy=P.y-k.y,d=Math.hypot(dx,dy);if(d<P.magnet){k.x+=dx/d*320*dt;k.y+=dy/d*320*dt;}
    if(d<P.r+6){k.dead=true;if(k.k==='coin'){coins+=k.v;tone(1300+Math.random()*300,0.04,'square',0.025);}else{P.hp=Math.min(P.maxHp,P.hp+30);tone(600,0.15,'triangle',0.06,400);texts.push({x:P.x,y:P.y-20,s:'+30 máu',t:0.8,col:'#7cf29a'});}}
    if(k.t>25)k.dead=true;}
  pickups=pickups.filter(k=>!k.dead);
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.9;p.vy*=0.9;}parts=parts.filter(p=>p.life>0);
  for(const t of texts){t.t-=dt;if(!t.big)t.y-=30*dt;}texts=texts.filter(t=>t.t>0);
  // wave clear
  if(!toSpawn.length&&!zombies.length&&state==='play'){if(waveClearT<0){waveClearT=1.6;ghEmit('milestone',{kind:'wave',value:wave});let got=0;for(const k of pickups)if(k.k==='coin'){got+=k.v;k.dead=true;}pickups=pickups.filter(k=>!k.dead);if(got){coins+=got;texts.push({x:P.x,y:P.y-30,s:'+'+got+' xu',t:1.2,col:'#ffd166'});}texts.push({x:0,y:0,s:'Đã sống sót đợt '+wave+'!',t:1.6,big:true,col:'#ffd166'});score+=wave*50;tone(523,0.15,'triangle',0.06);setTimeout(()=>tone(784,0.25,'triangle',0.06),150);}
    else{waveClearT-=dt;if(waveClearT<=0){waveClearT=-1;openShop();}}}
  // camera
  cam.x=Math.max(0,Math.min(AW-W,P.x-W/2));cam.y=Math.max(0,Math.min(AH-H,P.y-H/2));
}

function upCost(u){return u.base+u.step*(up[u.id]||0);}

function openShop(){
  state='shop';
  let h=`<span class="kicker">Hết đợt ${wave} · chuẩn bị</span><h2>🛒 Cửa hàng — sau đợt ${wave}</h2><div class="coinbar"><span>Xu <b>${coins}</b></span><span>Máu <b style="color:#ff7a6a">${Math.ceil(P.hp)}/${P.maxHp}</b></span><span>Điểm <b style="color:#fff">${score}</b></span></div><div class="shop">`;
  const heal=Math.max(0,P.maxHp-Math.ceil(P.hp)),hc=Math.ceil(heal*0.4);
  h+=`<button class="it" data-a="heal" ${heal===0||coins<hc?'disabled':''}><img alt="" src="${iconURL('med')}"><span><b>Băng cứu thương</b>Hồi đầy máu<br><span class="c">${hc} xu</span></span></button>`;
  WEAPONS.forEach((w,i)=>{if(i===0)return;h+=owned[i]?`<button class="it own" data-a="w${i}"><img alt="" src="${iconURL('w'+i)}"><span><b>${w.name}</b>Đã sở hữu · phím ${i+1}<br><span class="c">Trang bị</span></span></button>`:`<button class="it" data-a="w${i}" ${coins<w.cost?'disabled':''}><img alt="" src="${iconURL('w'+i)}"><span><b>${w.name}</b>Sát thương ${w.dmg}${w.pellets>1?'×'+w.pellets:''} · ${w.rate}/giây<br><span class="c">${w.cost} xu</span></span></button>`;});
  UPG.forEach(u=>{const lv=up[u.id]||0,c=upCost(u);let pips='';for(let i=0;i<u.max;i++)pips+=`<i class="${i<lv?'on':''}"></i>`;h+=`<button class="it" data-a="u${u.id}" ${lv>=u.max||coins<c?'disabled':''}><img alt="" src="${iconURL(u.id)}"><span><b>${u.name} (${lv}/${u.max})</b>${u.desc}<br><span class="c">${lv>=u.max?'Tối đa':c+' xu'}</span><span class="pips">${pips}</span></span></button>`;});
  h+=`</div><button class="btn" data-a="nextwave" data-def>▶ Bắt đầu đợt ${wave+1}</button>`;

function startGame(){P=newPlayer();score=0;coins=0;kills=0;zombies=[];bullets=[];acid=[];pickups=[];parts=[];decals=[];texts=[];owned=[true,false,false,false];curW=0;up={};state='play';hideOv();startWave(1);ghLive=true;ghEmit('start');}
function gameOver(){state='over';let rec=false;if(score>best.score){best.score=score;rec=true;}if(wave>best.wave)best.wave=wave;save('zom_best',best);ghEnd(rec);noise(0.6,0.1,400);
  setTimeout(()=>showOv(`<span class="kicker">Thị trấn đã nuốt chửng bạn</span><h1>☠ Bạn đã bị cắn!</h1>${rec?'<span class="newrec">KỶ LỤC MỚI!</span>':''}<div class="stats"><div class="st"><b data-count="${wave}">${wave}</b><small>Sống sót tới đợt</small></div><div class="st"><b data-count="${kills}">${kills}</b><small>Zombie đã hạ</small></div><div class="st hl"><b data-count="${score}">${score}</b><small>Điểm</small></div></div><p class="rec"><span>Kỷ lục: <b>${best.score}</b></span><span>Đợt xa nhất: <b>${best.wave}</b></span></p><button class="btn" data-a="new" data-def>Chơi lại</button><button class="btn s" data-a="menu">Màn hình chính</button>`),900);}
function pause(){state='pause';showOv(`<span class="kicker">Đợt ${wave}</span><h2>Tạm dừng</h2><div class="stats"><div class="st hl"><b>${score}</b><small>Điểm</small></div><div class="st"><b>${coins}</b><small>Xu</small></div><div class="st"><b>${Math.ceil(P.hp)}</b><small>Máu</small></div><div class="st"><b>${kills}</b><small>Đã hạ</small></div></div><button class="btn" data-a="resume" data-def>Tiếp tục</button><button class="btn s" data-a="quit">Bỏ cuộc</button>${settingsHTML()}`);}
function resume(){state='play';hideOv();}
function menu(){state='menu';showOv(`<span class="kicker">Đêm thứ 1 · thị trấn thất thủ</span><span class="logo">🧟 Bắn Zombie Sinh Tồn</span><p>Thị trấn đã thất thủ. Cầm súng, giữ mạng sống qua từng đợt zombie và nâng cấp vũ khí giữa các đợt!</p>
<div class="help"><span>Di chuyển</span><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> (cảm ứng: cần trái)</span><span>Ngắm &amp; bắn</span><span>Rê chuột + giữ chuột trái, hoặc dùng <b>phím mũi tên</b> để ngắm và bắn (cảm ứng: cần phải — đẩy là bắn)</span><span>Đổi súng</span><span><kbd>1</kbd>–<kbd>4</kbd>, <kbd>Q</kbd> hoặc lăn chuột</span><span>Cửa hàng</span><span>Nhặt <b style="color:#ffd166">xu</b> để mua súng mới &amp; nâng cấp. Hộp <b style="color:#7cf29a">cứu thương</b> hồi máu.</span><span>Cẩn thận</span><span>Zombie <b style="color:#e0a050">bom</b> phát nổ, zombie <b style="color:#80c0b0">nhổ axit</b> và trùm mỗi 5 đợt.</span><span>Phím</span><span>Tạm dừng: <kbd>P</kbd> / <kbd>Esc</kbd> · Tắt tiếng: <kbd>M</kbd></span></div>
<p class="rec"><span>Kỷ lục: <b>${best.score}</b> điểm</span><span>Đợt xa nhất: <b>${best.wave}</b></span></p><button class="btn" data-a="new" data-def>▶ Bắt đầu</button>${settingsHTML()}`);}
let curPanel=null;
function showOv(h){ov.innerHTML='<div class="panel">'+h+'</div>';ov.style.display='flex';pauseBtn.style.display='none';curPanel=state;animCounters();}
function hideOv(){ov.style.display='none';pauseBtn.style.display='block';}
function refreshPanel(){if(curPanel==='pause')pause();else if(curPanel==='menu')menu();}
ov.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;SFX.ui();
  if(a==='new')startGame();else if(a==='resume')resume();else if(a==='menu')menu();
  else if(a==='quit'){ghEnd(score>best.score);if(score>best.score)best.score=score;if(wave>best.wave)best.wave=wave;save('zom_best',best);menu();}
  else if(a==='mute'){muted=!muted;save('zom_mute',muted);refreshPanel();}
  else if(a==='music'){musicOn=!musicOn;save('zom_music',musicOn);refreshPanel();}
  else if(a==='fx'){fxHi=!fxHi;save('zom_fx',fxHi?'hi':'lo');ground=null;refreshPanel();}
  else if(a==='nextwave'){state='play';hideOv();startWave(wave+1);}
  else if(a==='heal'){const heal=Math.max(0,P.maxHp-Math.ceil(P.hp)),hc=Math.ceil(heal*0.4);if(coins>=hc){coins-=hc;P.hp=P.maxHp;SFX.buy();}openShop();}
  else if(a[0]==='w'){const i=parseInt(a.slice(1),10);if(!owned[i]&&coins>=WEAPONS[i].cost){coins-=WEAPONS[i].cost;owned[i]=true;SFX.buy();}if(owned[i])curW=i;openShop();}
  else if(a[0]==='u'){const u=UPG.find(x=>x.id===a.slice(1));const c=upCost(u);if(coins>=c&&(up[u.id]||0)<u.max){coins-=c;up[u.id]=(up[u.id]||0)+1;u.apply();SFX.buy();}openShop();}
});

function hash(a,b){let h=(a*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177;return ((h^(h>>>16))>>>0)/4294967295;}
function pre(w,h,ox,oy,sc,fn){const c=mkC(w*sc,h*sc),g=c.getContext('2d');g.scale(sc,sc);g.translate(ox,oy);g.lineJoin='round';g.lineCap='round';fn(g);return c;}
function circ(g,x,y,r,fill,stroke,lw){g.beginPath();g.arc(x,y,r,0,7);if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||1.5;g.stroke();}}
function ell(g,x,y,rx,ry,fill,stroke,lw){g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||1.5;g.stroke();}}
const OLZ='#0b0d08';
const LAMPS=[[AW/2-78,170],[AW/2+78,820],[180,AH/2-78],[1230,AH/2+78],[AW/2+78,AH/2-78],[460,AH/2+78],[AW/2-78,AH-120],[960,AH/2-78]];
const SPR={};
// ---- player (facing +x) ----
function playerSpr(wi){return pre(60,40,20,20,2,g=>{
  const gl=[12,18,24,28][wi];
  g.fillStyle='#4a3420';g.beginPath();g.ellipse(-7,0,5,8,0,0,7);g.fill();g.strokeStyle=OLZ;g.lineWidth=1.6;g.stroke(); // backpack
  // gun
  g.fillStyle='#1c1c1e';g.fillRect(6,1.5,gl,4.5);g.strokeStyle=OLZ;g.strokeRect(6,1.5,gl,4.5);g.fillStyle='#55565c';g.fillRect(7,1.8,gl-2,1.4);
  if(wi===1){g.fillStyle='#2a2a2e';g.fillRect(12,5.5,4,5);}
  if(wi===2){g.fillStyle='#6a4428';g.fillRect(14,1.5,6,4.5);g.fillStyle='#8a5a34';g.fillRect(4,1.2,5,5);}
  if(wi===3){g.fillStyle='#3a3a40';g.fillRect(12,-1.5,9,3);g.fillStyle='#8fd8ff';g.fillRect(20,-1.2,1.4,2.4);g.fillStyle='#6a4428';g.fillRect(2,1.4,6,4.8);}
  // arms
  g.strokeStyle=OLZ;g.lineWidth=5;g.beginPath();g.moveTo(1,-8);g.lineTo(9,1);g.moveTo(1,8);g.lineTo(7,5);g.stroke();
  g.strokeStyle='#5a6a42';g.lineWidth=3.4;g.beginPath();g.moveTo(1,-8);g.lineTo(9,1);g.moveTo(1,8);g.lineTo(7,5);g.stroke();
  circ(g,9,2,2.2,'#e0b088',OLZ,1);circ(g,7.5,5.4,2.2,'#e0b088',OLZ,1);
  // torso
  ell(g,0,0,7.5,11,'#4f5f3c',OLZ,1.8);g.fillStyle='#62744a';g.beginPath();g.ellipse(1,-2,5,7,0,0,7);g.fill();g.fillStyle='#3a4630';g.fillRect(-3,-10,2,20);
  // head
  circ(g,1.5,0,6,'#e0b088',OLZ,1.6);g.fillStyle='#8a2a24';g.beginPath();g.arc(0.5,0,5.6,1.2,5.1);g.fill();g.fillStyle='#a8382f';g.fillRect(-4,-1,3,2);
  g.fillStyle='#ffffff30';g.beginPath();g.arc(2.5,-2,2,0,7);g.fill();
});}
function feetSpr(f){return pre(30,30,15,15,2,g=>{const s=Math.sin(f/4*6.283)*4.5;g.fillStyle='#1e1e22';g.strokeStyle=OLZ;g.lineWidth=1;
  for(const [y,o] of [[-5,s],[5,-s]]){g.beginPath();g.ellipse(o,y,4.2,2.6,0,0,7);g.fill();g.stroke();}});}
// ---- zombies (facing +x) ----
const ZLOOK={walker:{cl:'#3a4a6a',cl2:'#2a3650'},runner:{cl:'#7a2a2a',cl2:'#561c1c'},spitter:{cl:'#3a5a50',cl2:'#2a4038'},tank:{cl:'#4a4038',cl2:'#2e2822'},boomer:{cl:'#8a5a2a',cl2:'#5e3a18'},boss:{cl:'#3a1a34',cl2:'#240e20'}};
function zombieSpr(t,f){const d=ZT[t],r=d.r,L=ZLOOK[t],S=r*2.6;return pre(S*2,S*2,S,S,2,g=>{
  const sw=Math.sin(f/4*6.283)*r*0.18;
  // arms reaching forward
  for(const sy of [-1,1]){const y0=sy*r*0.62,o=sy*sw;g.strokeStyle=OLZ;g.lineWidth=r*0.42+2;g.beginPath();g.moveTo(r*0.05,y0);g.lineTo(r*1.25+o,y0*0.75);g.stroke();g.strokeStyle=L.cl2;g.lineWidth=r*0.42;g.beginPath();g.moveTo(r*0.05,y0);g.lineTo(r*0.6+o*0.5,y0*0.85);g.stroke();
    g.strokeStyle=d.skin;g.beginPath();g.moveTo(r*0.6+o*0.5,y0*0.85);g.lineTo(r*1.22+o,y0*0.75);g.stroke();circ(g,r*1.3+o,y0*0.74,r*0.2,d.col,OLZ,1);}
  // body
  ell(g,-r*0.05,0,r*0.78,r,L.cl,OLZ,2);g.fillStyle=L.cl2;g.beginPath();g.moveTo(-r*0.5,-r*0.6);g.lineTo(-r*0.1,-r*0.2);g.lineTo(-r*0.6,r*0.1);g.fill();g.beginPath();g.moveTo(-r*0.2,r*0.5);g.lineTo(r*0.2,r*0.85);g.lineTo(-r*0.4,r*0.8);g.fill();
  g.fillStyle='#5a0a0a90';g.beginPath();g.ellipse(r*0.1,r*0.35,r*0.22,r*0.14,0.5,0,7);g.fill();
  if(t==='tank'){for(const sy of [-1,1]){ell(g,-r*0.05,sy*r*0.7,r*0.45,r*0.3,'#6a6258',OLZ,2);g.fillStyle='#8a8278';g.fillRect(-r*0.3,sy*r*0.72-1,r*0.4,2);}}
  if(t==='boomer'){for(const [x,y,s] of [[-0.4,-0.4,0.24],[-0.2,0.45,0.2],[0.25,-0.6,0.16],[-0.6,0.15,0.18]])circ(g,x*r,y*r,s*r,'#e8a040',OLZ,1);}
  if(t==='boss'){for(let i=0;i<5;i++){const y=(i-2)*r*0.38;g.fillStyle='#e8dcc0';g.strokeStyle=OLZ;g.lineWidth=1.5;g.beginPath();g.moveTo(-r*0.5,y-r*0.1);g.lineTo(-r*1.05,y);g.lineTo(-r*0.5,y+r*0.1);g.closePath();g.fill();g.stroke();}}
  // head
  const hr=r*0.5;circ(g,r*0.2,0,hr,d.skin,OLZ,2);g.fillStyle=d.col;g.beginPath();g.arc(r*0.12,0,hr*0.9,1.9,4.4);g.fill();
  g.fillStyle='#ffffff25';circ(g,r*0.3,-hr*0.35,hr*0.35,'#ffffff22');
  if(t==='spitter'){circ(g,r*0.55,0,hr*0.45,'#8cff5a',OLZ,1);}
  g.fillStyle='#200';g.fillRect(r*0.48,-hr*0.25,hr*0.35,hr*0.5);
},S);}
function buildSprites(){
  SPR.pl=[0,1,2,3].map(playerSpr);SPR.feet=[0,1,2,3].map(feetSpr);SPR.z={};SPR.zw={};
  for(const t in ZT){SPR.z[t]=[0,1,2,3].map(f=>zombieSpr(t,f));SPR.zw[t]=whiteOf(SPR.z[t][0]);}
  SPR.splat=[0,1,2,3].map(k=>pre(64,64,32,32,1,g=>{g.fillStyle='#fff';for(let i=0;i<9;i++){const a=hash(k,i)*6.28,d=hash(i,k+3)*20,r=4+hash(k*3,i)*9;circ(g,Math.cos(a)*d,Math.sin(a)*d,r,'#fff');}for(let i=0;i<7;i++){const a=hash(k+9,i)*6.28,d=20+hash(i,k+5)*10;circ(g,Math.cos(a)*d,Math.sin(a)*d,1.5+hash(k,i+7)*2,'#fff');}}));
  SPR.splatR=SPR.splat.map(s=>tint(s,'#5a0e0e'));SPR.splatG=SPR.splat.map(s=>tint(s,'#3a5a1a'));
  SPR.props=OBST.map((b,i)=>propSpr(b,i));
  SPR.icons={};
}
function tint(src,col){const c=mkC(src.width,src.height),g=c.getContext('2d');g.drawImage(src,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,c.width,c.height);return c;}
// ---- obstacle props (same rectangles, dressed as wrecked town objects) ----
function propSpr(b,i){const w=b.w,h=b.h;return pre(w+4,h+4,2,2,2,g=>{
  const hor=w>=h,kind=['car','bus','bags','police','container','crates','dumpster','pallet'][i];
  const R=(x,y,ww,hh,c)=>{g.fillStyle=c;g.fillRect(x,y,ww,hh);};
  if(kind==='car'||kind==='police'){const L=hor?w:h,T=hor?h:w;g.save();if(!hor){g.translate(w,0);g.rotate(Math.PI/2);}
    const body=kind==='police'?'#e8e8ec':'#7a2e22';g.fillStyle='#0e0e10';rrect(g,4,-1,10,T+2,3);g.fill();rrect(g,L-14,-1,10,T+2,3);g.fill();
    g.fillStyle=body;rrect(g,0,1,L,T-2,7);g.fill();g.strokeStyle=OLZ;g.lineWidth=1.5;g.stroke();
    if(kind==='police'){R(0,T*0.3,L,T*0.4,'#16161c');}
    g.fillStyle='#22303c';rrect(g,L*0.22,4,L*0.2,T-8,3);g.fill();rrect(g,L*0.62,4,L*0.16,T-8,3);g.fill();g.fillStyle=kind==='police'?'#d8d8de':'#943a2c';rrect(g,L*0.42,3,L*0.2,T-6,3);g.fill();
    g.strokeStyle='#8fb0c870';g.lineWidth=0.8;g.beginPath();g.moveTo(L*0.25,6);g.lineTo(L*0.35,T-8);g.moveTo(L*0.3,6);g.lineTo(L*0.26,T*0.6);g.stroke();
    R(L-3,4,2,5,'#fff6c0');R(L-3,T-9,2,5,'#fff6c0');R(1,4,2,5,'#c02020');R(1,T-9,2,5,'#c02020');
    if(kind==='police'){R(L*0.47,T*0.2,L*0.1,T*0.25,'#e02a2a');R(L*0.47,T*0.55,L*0.1,T*0.25,'#2a6ae0');}
    else{g.fillStyle='#3a1a1080';g.beginPath();g.ellipse(L*0.7,T*0.5,L*0.12,T*0.25,0,0,7);g.fill();}
    g.restore();}
