<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Thủ Thành</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#141a12;color:#fff;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#back{position:fixed;top:5px;left:8px;z-index:60;color:#ffd166;text-decoration:none;font-size:13px;background:rgba(0,0,0,.55);padding:4px 9px;border-radius:7px}
#pauseBtn{position:fixed;top:5px;right:8px;z-index:60;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:7px;font-size:13px;padding:4px 10px;cursor:pointer;display:none}
#stage{position:absolute;left:0;top:0}
canvas{display:block;width:100%;height:100%;border-radius:6px;box-shadow:0 6px 30px rgba(0,0,0,.6)}
#ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(8,10,6,.78);padding:36px 12px 12px;overflow:auto}
.panel{background:linear-gradient(#2c3324,#1c2117);border:2px solid #ffd166;border-radius:14px;padding:18px 20px;max-width:540px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.7);max-height:100%;overflow:auto}
.panel h1{font-size:28px;color:#ffd166;margin-bottom:6px;text-shadow:2px 2px 0 #5a3c00}
.panel h2{font-size:22px;color:#ffd166;margin-bottom:8px}
.panel p{font-size:14px;line-height:1.5;margin:6px 0;color:#e8ecdc}
.panel ul{text-align:left;font-size:13.5px;line-height:1.55;margin:8px 0 8px 18px;color:#e8ecdc}
.btn{display:inline-block;margin:5px;padding:10px 18px;font-size:15px;font-weight:bold;border:none;border-radius:9px;background:#ffd166;color:#2b1d00;cursor:pointer;box-shadow:0 3px 0 #a07a10}
.btn.s{background:#4f5a3f;color:#fff;box-shadow:0 3px 0 #2c3322;padding:7px 12px;font-size:13px}
.btn:active{transform:translateY(2px);box-shadow:none}
.hs{color:#7cf29a;font-weight:bold}
</style>
</head>
<body>
<a id="back" href="../index.html">← Danh sách game</a>
<button id="pauseBtn">⏸ Dừng</button>
<div id="stage"><canvas id="c" width="640" height="460"></canvas></div>
<div id="ov"></div>
<script>
(function(){
'use strict';
const W=640,H=460,TS=40,COLS=16,ROWS=9,MY=32,BY=MY+ROWS*TS;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),stage=document.getElementById('stage'),pauseBtn=document.getElementById('pauseBtn');
function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let best=load('thu_best',{score:0,wave:0,won:false});if(!best||typeof best!=='object')best={score:0,wave:0,won:false};let muted=!!load('thu_mute',false);
let ac=null;
function tone(f,d,type,vol,slide){if(muted)return;try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol||0.04,t);g.gain.exponentialRampToValueAtTime(0.0008,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}}
let sndT={};function sfx(name,fn){const now=performance.now();if(sndT[name]&&now-sndT[name]<60)return;sndT[name]=now;fn();}

function fit(){const vw=window.innerWidth,vh=window.innerHeight,top=30;const avail=vh-top-6;const s=Math.max(0.1,Math.min(vw/W,avail/H));const w=Math.floor(W*s),h=Math.floor(H*s);
  stage.style.width=w+'px';stage.style.height=h+'px';stage.style.left=Math.floor((vw-w)/2)+'px';stage.style.top=Math.max(top,Math.floor((vh-h)/2))+'px';}
window.addEventListener('resize',fit);fit();

// ---------- map ----------
const WP=[[-1,1],[2,1],[2,6],[6,6],[6,2],[10,2],[10,7],[13,7],[13,4],[16,4]];
const PATH=WP.map(([c,r])=>({x:c*TS+TS/2,y:MY+r*TS+TS/2}));
const pathCells=new Set();
for(let i=0;i<WP.length-1;i++){const [a,b]=[WP[i],WP[i+1]];const dc=Math.sign(b[0]-a[0]),dr=Math.sign(b[1]-a[1]);let c=a[0],r=a[1];while(true){if(c>=0&&c<COLS)pathCells.add(c+','+r);if(c===b[0]&&r===b[1])break;c+=dc;r+=dr;}}
const SEG=[];let PATHLEN=0;for(let i=0;i<PATH.length-1;i++){const a=PATH[i],b=PATH[i+1],l=Math.hypot(b.x-a.x,b.y-a.y);SEG.push({a:a,b:b,l:l,s:PATHLEN});PATHLEN+=l;}
function posAt(d){for(const s of SEG){if(d<=s.s+s.l){const k=(d-s.s)/s.l;return {x:s.a.x+(s.b.x-s.a.x)*k,y:s.a.y+(s.b.y-s.a.y)*k,ang:Math.atan2(s.b.y-s.a.y,s.b.x-s.a.x)};}}const l=PATH[PATH.length-1];return {x:l.x,y:l.y,ang:0};}
const DECOR=[[0,4,'tree'],[1,7,'rock'],[4,3,'tree'],[8,8,'tree'],[8,0,'rock'],[11,5,'tree'],[15,0,'tree'],[15,8,'rock'],[4,8,'pond'],[14,6,'tree']];
const decoSet=new Set(DECOR.map(d=>d[0]+','+d[1]));
function hash(a,b){let h=(a*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177;return ((h^(h>>>16))>>>0)/4294967295;}

// ---------- towers ----------
const TT=[
 {name:'Tháp Cung',short:'Cung',col:'#c98a4a',cost:50,lv:[{dmg:11,range:115,rate:1.7},{dmg:20,range:125,rate:2.0,cost:60},{dmg:34,range:140,rate:2.4,cost:120}],air:true,desc:'Bắn nhanh 1 mục tiêu'},
 {name:'Tháp Pháo',short:'Pháo',col:'#7a7f8a',cost:90,lv:[{dmg:26,range:100,rate:0.65,splash:48},{dmg:46,range:108,rate:0.72,splash:54,cost:100},{dmg:80,range:118,rate:0.8,splash:62,cost:180}],air:false,desc:'Nổ diện rộng, không bắn được quái bay'},
 {name:'Tháp Băng',short:'Băng',col:'#6fc3ff',cost:70,lv:[{dmg:5,range:90,rate:1.2,slow:0.45,slowT:1.6,splash:32},{dmg:9,range:100,rate:1.4,slow:0.55,slowT:2,splash:40,cost:80},{dmg:15,range:112,rate:1.6,slow:0.65,slowT:2.4,splash:50,cost:140}],air:true,desc:'Làm chậm kẻ địch'},
 {name:'Tháp Sét',short:'Sét',col:'#c9a0ff',cost:130,lv:[{dmg:30,range:120,rate:0.8,chain:3},{dmg:50,range:130,rate:0.95,chain:4,cost:140},{dmg:85,range:145,rate:1.1,chain:6,cost:240}],air:true,desc:'Tia sét lan nhiều mục tiêu, xuyên giáp'}
];
const ET={
 grunt:{name:'Lính',hp:40,spd:46,armor:0,reward:5,col:'#c94a4a',r:10,lives:1},
 runner:{name:'Kỵ sói',hp:26,spd:88,armor:0,reward:5,col:'#d9a34a',r:9,lives:1},
 armor:{name:'Khiên sắt',hp:105,spd:34,armor:5,reward:11,col:'#8a9aaa',r:12,lives:1},
 flyer:{name:'Quạ',hp:34,spd:62,armor:0,reward:7,col:'#5a4a7a',r:10,lives:1,fly:true},
 healer:{name:'Pháp sư',hp:75,spd:40,armor:1,reward:14,col:'#4ac98a',r:11,lives:1,heal:true},
 boss:{name:'Đại tướng',hp:850,spd:27,armor:7,reward:110,col:'#8a2a4a',r:18,lives:5}
};
const WAVES=[
 [['grunt',8,1.1]],
 [['grunt',12,0.9]],
 [['grunt',8,0.9],['runner',6,0.8]],
 [['runner',14,0.6]],
 [['grunt',10,0.8],['armor',3,1.6]],
 [['flyer',8,0.9],['grunt',10,0.7]],
 [['armor',6,1.2],['runner',12,0.5]],
 [['healer',2,2],['grunt',16,0.6]],
 [['flyer',12,0.7],['armor',5,1.2]],
 [['grunt',10,0.6],['boss',1,1]],
 [['runner',22,0.4]],
 [['armor',10,1],['healer',3,1.5]],
 [['flyer',16,0.55],['runner',12,0.45]],
 [['grunt',20,0.45],['armor',8,0.9],['healer',3,1.4]],
 [['flyer',10,0.6],['boss',2,4]],
 [['armor',16,0.8],['healer',4,1.3]],
 [['runner',26,0.33],['flyer',16,0.5]],
 [['armor',14,0.7],['healer',4,1.2],['boss',1,1]],
 [['flyer',20,0.45],['armor',12,0.7],['runner',16,0.35]],
 [['healer',6,1],['armor',10,0.7],['boss',4,3.2]]
];
const NW=WAVES.length;

// ---------- state ----------
let state='menu',money=0,lives=0,wave=0,score=0,towers=[],enemies=[],projs=[],fx=[],parts=[],texts=[],spawnQ=[],spawnT=0,waveActive=false,speed=1,buildType=-1,selTower=null,hover=null,gameT=0,flashMsg='',flashT=0;
function hpScale(w){return 1+0.2*(w-1)+0.016*(w-1)*(w-1);}
function startGame(){money=220;lives=20;wave=0;score=0;towers=[];enemies=[];projs=[];fx=[];parts=[];texts=[];spawnQ=[];waveActive=false;speed=1;buildType=-1;selTower=null;state='play';hideOv();}
function nextWave(){
  if(waveActive&&spawnQ.length)return;if(wave>=NW)return;
  if(waveActive){const bonus=10+wave*2;money+=bonus;texts.push({x:W/2,y:MY+40,s:'Gọi sớm +'+bonus+' vàng',t:1.2,col:'#ffd166'});}
  wave++;waveActive=true;spawnQ=[];let t=0.5;
  for(const [type,n,iv] of WAVES[wave-1]){for(let i=0;i<n;i++){spawnQ.push({t:t,type:type});t+=iv;}t+=1.2;}
  spawnQ.sort((a,b)=>a.t-b.t);spawnT=0;
  flashMsg='Đợt '+wave+'/'+NW;flashT=1.8;tone(300,0.3,'sawtooth',0.04,200);
}
function spawn(type){const d=ET[type],hp=Math.round(d.hp*hpScale(wave));enemies.push({type:type,d:0,hp:hp,maxHp:hp,spd:d.spd,armor:d.armor,slowF:0,slowT:0,flash:0,x:PATH[0].x,y:PATH[0].y,ang:0,t:Math.random()*5,fly:!!d.fly});}
function damage(e,dmg,pierce){if(e.dead)return;const real=Math.max(1,dmg-(pierce?0:e.armor));e.hp-=real;e.flash=0.08;if(e.hp<=0){e.dead=true;const rw=ET[e.type].reward;money+=rw;score+=rw*2;burst(e.x,e.y,ET[e.type].col,10);texts.push({x:e.x,y:e.y-10,s:'+'+rw,t:0.8,col:'#ffd166'});sfx('die',()=>tone(180,0.08,'square',0.03,-80));}}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=20+Math.random()*120;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.3+Math.random()*0.4,col:col});}}
function towerStats(t){return TT[t.type].lv[t.lv];}
function canBuild(c,r){if(c<0||r<0||c>=COLS||r>=ROWS)return false;const k=c+','+r;if(pathCells.has(k)||decoSet.has(k))return false;return !towers.some(t=>t.c===c&&t.r===r);}
function build(c,r){const tt=TT[buildType];if(!canBuild(c,r)){tone(120,0.1,'square',0.04);return;}if(money<tt.cost){msg('Không đủ vàng!');return;}
  money-=tt.cost;const t={type:buildType,c:c,r:r,x:c*TS+TS/2,y:MY+r*TS+TS/2,lv:0,cd:0,ang:-Math.PI/2,spent:tt.cost,kick:0};towers.push(t);burst(t.x,t.y,'#d9c9a0',10);tone(440,0.08,'triangle',0.06);tone(660,0.1,'triangle',0.05);
  selTower=null;if(money<tt.cost)buildType=-1;}
function upgrade(t){if(!t||t.lv>=2)return;const c=TT[t.type].lv[t.lv+1].cost;if(money<c){msg('Không đủ vàng!');return;}money-=c;t.spent+=c;t.lv++;burst(t.x,t.y,'#ffd166',16);tone(523,0.08,'triangle',0.06);setTimeout(()=>tone(784,0.12,'triangle',0.06),80);}
function sell(t){if(!t)return;const v=Math.floor(t.spent*0.7);money+=v;towers=towers.filter(o=>o!==t);selTower=null;texts.push({x:t.x,y:t.y,s:'+'+v,t:0.9,col:'#ffd166'});tone(330,0.1,'triangle',0.05,-100);}
function msg(s){flashMsg=s;flashT=1.2;tone(120,0.12,'square',0.04);}

function update(dt){
  gameT+=dt;
  if(waveActive){spawnT+=dt;while(spawnQ.length&&spawnQ[0].t<=spawnT)spawn(spawnQ.shift().type);}
  // enemies
  for(const e of enemies){
    if(e.dead)continue;e.t+=dt;if(e.flash>0)e.flash-=dt;
    if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slowF=0;}
    e.d+=e.spd*(1-e.slowF)*dt;const p=posAt(e.d);e.x=p.x;e.y=p.y;e.ang=p.ang;
    if(ET[e.type].heal){for(const o of enemies)if(!o.dead&&o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<70&&o.hp<o.maxHp){o.hp=Math.min(o.maxHp,o.hp+o.maxHp*0.05*dt);}}
    if(e.d>=PATHLEN){e.dead=true;e.leaked=true;lives-=ET[e.type].lives;tone(90,0.3,'sawtooth',0.06);flashMsg='-'+ET[e.type].lives+' mạng';flashT=0.8;
      if(lives<=0){lives=0;gameOver();return;}}
  }
  enemies=enemies.filter(e=>!e.dead);
  // towers
  for(const t of towers){
    const s=towerStats(t),tt=TT[t.type];t.cd-=dt;if(t.kick>0)t.kick-=dt;
    let target=null,bd=-1;
    for(const e of enemies){if(e.dead||(e.fly&&!tt.air))continue;if(Math.hypot(e.x-t.x,e.y-t.y)<=s.range&&e.d>bd){bd=e.d;target=e;}}
    if(target){t.ang=Math.atan2(target.y-t.y,target.x-t.x);
      if(t.cd<=0){t.cd=1/s.rate;t.kick=0.1;
        if(t.type===0){projs.push({k:'arrow',x:t.x,y:t.y,tg:target,spd:520,dmg:s.dmg});sfx('arrow',()=>tone(1400,0.04,'triangle',0.02,-600));}
        else if(t.type===1){const lead=posAt(target.d+target.spd*(1-target.slowF)*0.55);projs.push({k:'ball',x:t.x,y:t.y,sx:t.x,sy:t.y,tx:lead.x,ty:lead.y,t:0,dur:0.55,dmg:s.dmg,splash:s.splash});sfx('cannon',()=>tone(110,0.15,'square',0.05,-40));}
        else if(t.type===2){projs.push({k:'ice',x:t.x,y:t.y,tg:target,spd:340,dmg:s.dmg,slow:s.slow,slowT:s.slowT,splash:s.splash});sfx('ice',()=>tone(1800,0.06,'sine',0.03,-900));}
        else{const hit=[target];let last=target;for(let i=1;i<s.chain;i++){let nb=null,nd=90;for(const e of enemies){if(e.dead||hit.includes(e))continue;const d=Math.hypot(e.x-last.x,e.y-last.y);if(d<nd){nd=d;nb=e;}}if(!nb)break;hit.push(nb);last=nb;}
          const pts=[{x:t.x,y:t.y-14}].concat(hit.map(e=>({x:e.x,y:e.y})));fx.push({k:'bolt',pts:pts,t:0.18});hit.forEach((e,i)=>damage(e,s.dmg*Math.pow(0.85,i),true));sfx('zap',()=>tone(220,0.12,'sawtooth',0.04,600));}
      }}
  }
  // projectiles
  for(const p of projs){
    if(p.k==='ball'){p.t+=dt;const k=Math.min(1,p.t/p.dur);p.x=p.sx+(p.tx-p.sx)*k;p.y=p.sy+(p.ty-p.sy)*k-Math.sin(k*Math.PI)*40;
      if(k>=1){p.dead=true;fx.push({k:'boom',x:p.tx,y:p.ty,r:p.splash,t:0.3});burst(p.tx,p.ty,'#ffb347',10);sfx('boom',()=>tone(70,0.2,'sawtooth',0.05,-30));
        for(const e of enemies)if(!e.dead&&!e.fly&&Math.hypot(e.x-p.tx,e.y-p.ty)<=p.splash)damage(e,p.dmg,false);}}
    else{const tg=p.tg;if(tg.dead&&!p.lx){p.lx=tg.x;p.ly=tg.y;}const tx=tg.dead?p.lx:tg.x,ty=tg.dead?p.ly:tg.y;const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);p.ang=Math.atan2(dy,dx);
      if(d<=p.spd*dt+4){p.dead=true;
        if(p.k==='arrow'){if(!tg.dead)damage(tg,p.dmg,false);}
        else{fx.push({k:'frost',x:tx,y:ty,r:p.splash,t:0.3});for(const e of enemies){if(e.dead)continue;if(Math.hypot(e.x-tx,e.y-ty)<=p.splash){damage(e,p.dmg,false);if(!e.dead){e.slowF=Math.max(e.slowF,e.type==='boss'?p.slow*0.5:p.slow);e.slowT=p.slowT;}}}}}
      else{p.x+=dx/d*p.spd*dt;p.y+=dy/d*p.spd*dt;}}
  }
  projs=projs.filter(p=>!p.dead);
  for(const f of fx)f.t-=dt;fx=fx.filter(f=>f.t>0);
  for(const q of parts){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.9;q.vy*=0.9;}parts=parts.filter(q=>q.life>0);
  for(const t of texts){t.t-=dt;t.y-=24*dt;}texts=texts.filter(t=>t.t>0);
  if(flashT>0)flashT-=dt;
  // wave end
  if(waveActive&&!spawnQ.length&&!enemies.length){waveActive=false;const bonus=25+wave*5;money+=bonus;score+=wave*100;texts.push({x:W/2,y:MY+80,s:'Hoàn thành đợt '+wave+'! +'+bonus+' vàng',t:2,col:'#7cf29a'});tone(523,0.1,'triangle',0.05);setTimeout(()=>tone(659,0.1,'triangle',0.05),100);setTimeout(()=>tone(784,0.2,'triangle',0.05),200);
    if(wave>=NW)win();}
}

// ---------- input ----------
function toCanvas(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
const BTN={tower:i=>({x:6+i*112,y:BY+8,w:106,h:52}),next:{x:458,y:BY+8,w:118,h:52},speed:{x:582,y:BY+8,w:52,h:52},
  up:{x:330,y:BY+8,w:130,h:52},sell:{x:466,y:BY+8,w:110,h:52},close:{x:582,y:BY+8,w:52,h:52}};
function inR(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
cv.addEventListener('pointermove',e=>{const p=toCanvas(e);hover=p.y>=MY&&p.y<BY?{c:Math.floor(p.x/TS),r:Math.floor((p.y-MY)/TS)}:null;if(e.pointerType!=='mouse')hover=null;});
cv.addEventListener('pointerleave',()=>{hover=null;});
cv.addEventListener('contextmenu',e=>{e.preventDefault();buildType=-1;selTower=null;});
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;e.preventDefault();if(e.button===2)return;const p=toCanvas(e);
  if(p.y>=BY){
    if(selTower){if(inR(p,BTN.up))upgrade(selTower);else if(inR(p,BTN.sell))sell(selTower);else if(inR(p,BTN.close))selTower=null;return;}
    for(let i=0;i<4;i++)if(inR(p,BTN.tower(i))){buildType=buildType===i?-1:i;if(buildType>=0&&money<TT[i].cost){msg('Không đủ vàng!');}tone(600,0.04,'square',0.03);return;}
    if(inR(p,BTN.next)){nextWave();return;}
    if(inR(p,BTN.speed)){speed=speed===1?2:speed===2?3:1;tone(500,0.04,'square',0.03);return;}
    return;
  }
  if(p.y<MY)return;
  const c=Math.floor(p.x/TS),r=Math.floor((p.y-MY)/TS);
  const t=towers.find(o=>o.c===c&&o.r===r);
  if(t){selTower=selTower===t?null:t;buildType=-1;tone(700,0.03,'square',0.03);return;}
  if(buildType>=0){build(c,r);return;}
  selTower=null;
});
window.addEventListener('keydown',e=>{
  if(e.code==='Space')e.preventDefault();
  if(e.code==='KeyP'||e.code==='Escape'){if(state==='play'){if(e.code==='Escape'&&(buildType>=0||selTower)){buildType=-1;selTower=null;return;}pause();}else if(state==='pause')resume();return;}
  if(e.code==='KeyM'){muted=!muted;save('thu_mute',muted);}

  if(state!=='play')return;

  if(e.code==='Space'||e.code==='KeyN')nextWave();
