<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Thủ Thành</title>
<style>
:root{--bg:#121810;--bgimg:radial-gradient(110% 80% at 50% 0%,#26331e 0%,#141a10 55%,#080b06 100%);--acc:#ffd166;--accd:#5a3a00;--txt:#eef0e0;--mut:#b4b89a;--good:#7cf29a;--p1:#3a3222;--p2:#221d13;--ovbg:radial-gradient(ellipse at 50% 40%,rgba(40,30,10,.3),rgba(6,8,4,.84));--b1:#ffe08a;--b2:#e8a832;--b3:#7a4e00;--ink:#2b1a00;--s1:#5a6a44;--s2:#3e4a2e;--s3:#1e2616;--logo:linear-gradient(180deg,#fff6d8 0%,#ffd166 45%,#c07a1a 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);background-image:var(--bgimg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#back{position:fixed;top:5px;left:8px;z-index:60;color:var(--acc);text-decoration:none;font-size:13px;font-weight:600;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#back:hover{background:rgba(0,0,0,.75)}
#pauseBtn{position:fixed;top:5px;right:8px;z-index:60;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:8px;font:700 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:5px 11px;cursor:pointer;display:none;transition:background .15s}
#pauseBtn:hover{background:rgba(0,0,0,.8)}
#stage{position:absolute;left:0;top:0;border-radius:8px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 10px 40px rgba(0,0,0,.6)}
canvas{display:block;width:100%;height:100%;border-radius:8px}
#ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--ovbg);padding:38px 12px 12px;overflow:auto;animation:ovin .3s ease-out}
@keyframes ovin{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.panel{position:relative;background:linear-gradient(180deg,var(--p1),var(--p2));border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:20px 20px 16px;max-width:540px;width:100%;text-align:center;box-shadow:0 0 0 4px rgba(0,0,0,.3),0 0 0 5px var(--accd),0 24px 60px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.14);max-height:100%;overflow:auto;animation:pop .38s cubic-bezier(.2,1.3,.4,1)}
.panel:before{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;background:radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.10),transparent 60%)}
.panel h1{font-size:30px;font-weight:900;letter-spacing:-.3px;color:var(--acc);margin-bottom:6px;text-shadow:0 3px 0 var(--accd),0 6px 16px rgba(0,0,0,.45);line-height:1.15}
.panel h2{font-size:23px;font-weight:900;color:var(--acc);margin-bottom:8px;text-shadow:0 2px 0 var(--accd)}
.panel p{font-size:14px;line-height:1.5;margin:6px 0;color:var(--txt)}
.panel ul{text-align:left;font-size:13px;line-height:1.55;margin:8px 0 8px 18px;color:var(--txt)}
.panel .sub{color:var(--mut);font-size:13px}
.logo{display:block;font-size:36px;font-weight:900;line-height:1.05;letter-spacing:-.5px;margin:2px 0 6px;background:var(--logo);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 var(--accd)) drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.kicker{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.btn{position:relative;display:inline-block;margin:5px;padding:11px 20px;font:800 15px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;border:none;border-radius:12px;background:linear-gradient(180deg,var(--b1),var(--b2));color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--b3),0 8px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.08) saturate(1.05);transform:translateY(-1px);box-shadow:0 5px 0 var(--b3),0 10px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.55)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--b3),0 3px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.btn:focus-visible,.tg:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn.s{background:linear-gradient(180deg,var(--s1),var(--s2));color:#fff;box-shadow:0 3px 0 var(--s3),0 6px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.2);padding:8px 13px;font-size:13px}
.btn.s:hover{box-shadow:0 4px 0 var(--s3),0 8px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.s:active{box-shadow:0 1px 0 var(--s3)}
.btn[disabled]{opacity:.38;filter:grayscale(.6);cursor:default;transform:none}
.hs{color:var(--good);font-weight:800}
.opts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0 2px}
.tg{font:700 12px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.16);color:var(--mut);cursor:pointer;transition:all .15s}
.tg:hover{border-color:rgba(255,255,255,.4);color:#fff}
.tg.on{color:#fff;background:rgba(255,255,255,.12);border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:12px 0}
.st{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:9px 6px 8px}
.st b{display:block;font-size:22px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;line-height:1.1}
.st small{display:block;color:var(--mut);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.st.hl b{color:var(--acc)}
.help{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;text-align:left;font-size:13px;line-height:1.4;color:var(--txt);margin:12px 0;background:rgba(0,0,0,.22);border-radius:12px;padding:10px 12px;border:1px solid rgba(255,255,255,.07)}
.help>span:nth-child(odd){color:var(--acc);font-weight:800;white-space:nowrap}
kbd{display:inline-block;min-width:18px;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-bottom-width:2px;font:700 11px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;text-align:center}
.rec{display:inline-flex;gap:14px;justify-content:center;font-size:13px;color:var(--mut);margin:4px 0 8px}
.rec b{color:var(--good)}
.newrec{display:inline-block;margin:2px 0 4px;padding:3px 10px;border-radius:999px;background:var(--good);color:#082010;font-weight:900;font-size:12px;letter-spacing:.06em;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){#ov,.panel,.newrec{animation:none}}
@media (max-width:420px){.help{grid-template-columns:1fr;gap:1px 0}.help>span:nth-child(odd){margin-top:6px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}.help>span:first-child{margin-top:0}.panel{padding:16px 13px 12px}.logo{font-size:30px}.panel h1{font-size:25px}.btn{padding:10px 16px}}

.panel{border-color:rgba(255,209,102,.35);background-image:linear-gradient(180deg,var(--p1),var(--p2)),repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 3px,transparent 3px 9px)}
canvas{cursor:pointer}
</style>
</head>
<body>
<a id="back" href="../index.html">← Danh sách game</a>
<button id="pauseBtn">⏸ Dừng</button>
<div id="stage"><canvas id="c" width="640" height="460"></canvas></div>
<div id="ov"></div>
<script>
(function(){
'use strict';
const W=640,H=460,TS=40,COLS=16,ROWS=9,MY=32,BY=MY+ROWS*TS;
let RS=1;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),stage=document.getElementById('stage'),pauseBtn=document.getElementById('pauseBtn');
function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function ghEmit(type, data){try{if(window.parent&&window.parent!==window)window.parent.postMessage(Object.assign({gh:1,type:type},data||{}),'*')}catch(e){}}
let ghLive=false;function ghEnd(w,rec){if(!ghLive)return;ghLive=false;ghEmit('end',{score:finalScore(),win:w,best:!!rec});}
let best=load('thu_best',{score:0,wave:0,won:false});if(!best||typeof best!=='object')best={score:0,wave:0,won:false};let muted=!!load('thu_mute',false);

// ---------- settings ----------
const RM=(function(){try{return !!matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}})();
let fxHi=load('thu_fx','hi')!=='lo',musicOn=load('thu_music',true)!==false;
// no saved choice yet -> pick a default and auto-drop to "Thấp" if the device can't keep up
let fxAuto=load('thu_fx',null)===null,perfAcc=0,perfN=0;
if(fxAuto&&navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=2)fxHi=false;
function perfWatch(dt,playing){if(!fxAuto||!fxHi||!playing||document.hidden)return;perfAcc+=dt;if(++perfN>=150){if(perfAcc/perfN>0.027){fxHi=false;fxAuto=false;}perfAcc=0;perfN=0;}}
// ---------- audio engine (layered Web Audio, music bus with echo) ----------
let ac=null,bus=null,mbus=null,nbuf=null;
function A(){
  if(!ac){const C=window.AudioContext||window.webkitAudioContext;ac=new C();
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.connect(ac.destination);
    bus=ac.createGain();bus.gain.value=1;bus.connect(comp);
    mbus=ac.createGain();mbus.gain.value=0;mbus.connect(comp);
    const dl=ac.createDelay(1),fb=ac.createGain(),wet=ac.createGain(),lp=ac.createBiquadFilter();dl.delayTime.value=0.33;fb.gain.value=0.3;wet.gain.value=0.3;lp.frequency.value=2200;
    mbus.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(wet);wet.connect(comp);
    const n=ac.sampleRate;nbuf=ac.createBuffer(1,n,n);const d=nbuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}
  if(ac.state==='suspended')ac.resume();return ac;}
function tone(f,d,type,vol,slide,o){if(muted)return;try{o=o||{};const a=A(),t=a.currentTime+(o.at||0),os=a.createOscillator(),g=a.createGain(),v=1+(Math.random()-0.5)*(o.vr==null?0.06:o.vr);
  os.type=type||'square';os.frequency.setValueAtTime(f*v,t);if(slide)os.frequency.exponentialRampToValueAtTime(Math.max(30,(f+slide)*v),t+d);if(o.det)os.detune.value=o.det;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol||0.05,t+(o.a||0.004));g.gain.exponentialRampToValueAtTime(0.0005,t+d);
  let n=os;if(o.lp){const fl=a.createBiquadFilter();fl.type=o.ft||'lowpass';fl.frequency.value=o.lp;fl.Q.value=o.q||0.7;os.connect(fl);n=fl;}
  n.connect(g);g.connect(bus);os.start(t);os.stop(t+d+0.05);}catch(e){}}
function noise(d,vol,lp,o){if(muted)return;try{o=o||{};const a=A(),t=a.currentTime+(o.at||0),s=a.createBufferSource(),g=a.createGain(),fl=a.createBiquadFilter();
  s.buffer=nbuf;s.playbackRate.value=0.8+Math.random()*0.4;fl.type=o.ft||'lowpass';fl.frequency.setValueAtTime(lp||2500,t);if(o.sw)fl.frequency.exponentialRampToValueAtTime(o.sw,t+d);fl.Q.value=o.q||0.8;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol||0.08,t+0.003);g.gain.exponentialRampToValueAtTime(0.0005,t+d);s.connect(fl);fl.connect(g);g.connect(bus);s.start(t,Math.random()*0.5);s.stop(t+d+0.05);}catch(e){}}
// music: tiny step sequencer, scheduled ahead on the audio clock
let mStep=0,mNext=0;
function mn(t,f,d,type,vol,lp){try{const os=ac.createOscillator(),g=ac.createGain();os.type=type;os.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0005,t+d);let n=os;if(lp){const fl=ac.createBiquadFilter();fl.frequency.value=lp;os.connect(fl);n=fl;}n.connect(g);g.connect(mbus);os.start(t);os.stop(t+d+0.05);}catch(e){}}
function mz(t,d,vol,f,ft){try{const s=ac.createBufferSource(),g=ac.createGain(),fl=ac.createBiquadFilter();s.buffer=nbuf;fl.type=ft||'highpass';fl.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0005,t+d);s.connect(fl);fl.connect(g);g.connect(mbus);s.start(t,Math.random()*0.5);s.stop(t+d+0.05);}catch(e){}}
function kick(t,v){try{const os=ac.createOscillator(),g=ac.createGain();os.frequency.setValueAtTime(150,t);os.frequency.exponentialRampToValueAtTime(42,t+0.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0005,t+0.16);os.connect(g);g.connect(mbus);os.start(t);os.stop(t+0.2);}catch(e){}}
const NF=n=>440*Math.pow(2,(n-69)/12);
function sdeg(S,i){const m=S.mode;return m[((i%7)+7)%7]+12*Math.floor(i/7);}
function mhash(a,b){let h=(a*2654435761^b*1597334677)>>>0;h=Math.imul(h^(h>>>15),2246822507)>>>0;return (h^(h>>>13))>>>0;}
function musicTick(){if(!ac)return;const want=!muted&&musicOn&&musicWanted();mbus.gain.setTargetAtTime(want?0.55:0,ac.currentTime,0.2);
  if(!want){mNext=0;return;}const now=ac.currentTime;if(mNext<now)mNext=now+0.06;const S=SONG(),spb=60/S.bpm/4;
  while(mNext<now+0.22){songStep(S,mStep++,mNext,spb);mNext+=spb;}}
setInterval(musicTick,50);
window.addEventListener('pointerdown',()=>{if(!muted)A();},true);window.addEventListener('keydown',()=>{if(!muted)A();},true);
// ---------- shared canvas helpers ----------
function mkC(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
function outline(c,col){const g=c.getContext('2d'),w=c.width,h=c.height,id=g.getImageData(0,0,w,h),s=id.data,o=new Uint8ClampedArray(s);
  const r=parseInt(col.slice(1,3),16),gg=parseInt(col.slice(3,5),16),b=parseInt(col.slice(5,7),16);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(s[i+3]>60)continue;
    if((x>0&&s[i-1]>60)||(x<w-1&&s[i+7]>60)||(y>0&&s[i-w*4+3]>60)||(y<h-1&&s[i+w*4+3]>60)){o[i]=r;o[i+1]=gg;o[i+2]=b;o[i+3]=255;}}
  id.data.set(o);g.putImageData(id,0,0);return c;}
function spr(w,h,draw,ol){const c=mkC(w+2,h+2),g=c.getContext('2d');g.translate(1,1);draw((x,y,ww,hh,col)=>{g.fillStyle=col;g.fillRect(x,y,ww,hh);},g);g.setTransform(1,0,0,1,0,0);if(ol)outline(c,ol);return c;}
function whiteOf(c){const o=mkC(c.width,c.height),g=o.getContext('2d');g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,o.width,o.height);return o;}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
function settingsHTML(){return `<div class="opts"><button class="tg ${muted?'':'on'}" data-a="mute">${muted?'🔇':'🔊'} Âm thanh: ${muted?'Tắt':'Bật'}</button><button class="tg ${musicOn?'on':''}" data-a="music">♪ Nhạc: ${musicOn?'Bật':'Tắt'}</button><button class="tg ${fxHi?'on':''}" data-a="fx">✦ Hiệu ứng: ${fxHi?'Cao':'Thấp'}</button></div>`;}
function animCounters(){if(RM)return;ov.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,t0=performance.now(),dur=700;const st=n=>{const k=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e);if(k<1)requestAnimationFrame(st);};el.textContent='0';requestAnimationFrame(st);});}
// cached glow / vignette sprites (avoid per-frame gradient creation)
const GLOWC={};
function glowS(rgb,a){a=Math.round(Math.max(0,Math.min(1,a))*20)/20;const k=rgb+'|'+a;if(GLOWC[k])return GLOWC[k];const c=mkC(64,64),g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba('+rgb+','+a+')');gr.addColorStop(0.55,'rgba('+rgb+','+(a*0.45)+')');gr.addColorStop(1,'rgba('+rgb+',0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return GLOWC[k]=c;}
function glow(g,rgb,a,x,y,r){if(r<=0||a<=0.02)return;g.drawImage(glowS(rgb,a),x-r,y-r,r*2,r*2);}
function hexRgb(h){return parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16);}
const VIGC={};
function vignette(g,x,y,w,h,inner,col,a){const k=w+'x'+h+inner+col+a;let c=VIGC[k];if(!c){c=VIGC[k]=mkC(w/4,h/4);const q=c.getContext('2d'),gr=q.createRadialGradient(w/8,h/8,Math.min(w,h)/4*inner,w/8,h/8,Math.hypot(w,h)/8);gr.addColorStop(0,'rgba('+col+',0)');gr.addColorStop(1,'rgba('+col+','+a+')');q.fillStyle=gr;q.fillRect(0,0,w/4,h/4);}
  const sm=g.imageSmoothingEnabled;g.imageSmoothingEnabled=true;g.drawImage(c,x,y,w,h);g.imageSmoothingEnabled=sm;}

let sndT={};function sfx(name,fn){const now=performance.now();if(sndT[name]&&now-sndT[name]<60)return;sndT[name]=now;fn();}
const SFX={
 arrow(){tone(1100,0.05,'triangle',0.025,-500);noise(0.04,0.025,4000,{ft:'highpass'});},
 cannon(){noise(0.25,0.08,700,{sw:120});tone(90,0.22,'sine',0.08,-50);},
 boom(){noise(0.35,0.08,900,{sw:90});tone(60,0.3,'sine',0.07,-25);},
 ice(){tone(1900,0.09,'sine',0.025,-800);tone(2800,0.12,'sine',0.012,-400,{at:0.02});noise(0.06,0.02,6000,{ft:'highpass'});},
 zap(){tone(200,0.14,'sawtooth',0.035,900,{lp:3000});noise(0.12,0.04,5000,{ft:'bandpass',q:2});},
 die(){noise(0.1,0.03,1500,{sw:300});tone(220,0.08,'square',0.02,-120,{lp:1200});},
 build(){tone(180,0.05,'square',0.04,0,{lp:900});tone(220,0.05,'square',0.04,0,{at:0.07,lp:900});tone(660,0.14,'triangle',0.05,0,{at:0.14});tone(990,0.16,'triangle',0.04,0,{at:0.2});},
 up(){[523,659,784,1047].forEach((f,i)=>tone(f,0.14,'triangle',0.05,0,{at:i*0.07,vr:0}));tone(2093,0.25,'sine',0.02,0,{at:0.28,vr:0});},
 sell(){[1319,1047,784].forEach((f,i)=>tone(f,0.08,'square',0.025,0,{at:i*0.05,lp:3000}));},
 leak(){tone(110,0.4,'sawtooth',0.06,-30,{lp:600});tone(73,0.5,'sawtooth',0.05,0,{lp:500,at:0.05});},
 horn(){[[294,0],[294,0.18],[440,0.36]].forEach(([f,t])=>{tone(f,0.32,'sawtooth',0.035,0,{at:t,lp:1400,vr:0});tone(f*1.5,0.32,'triangle',0.02,0,{at:t,vr:0});});},
 deny(){tone(140,0.12,'square',0.035,-40,{lp:900});},
 ui(){tone(620,0.04,'triangle',0.04,180);},
 win(){[523,659,784,1047,1319].forEach((f,i)=>{tone(f,0.25,'triangle',0.06,0,{at:i*0.13,vr:0});tone(f/2,0.25,'square',0.02,0,{at:i*0.13,lp:1500,vr:0});});}
};
function fit(){const vw=window.innerWidth,vh=window.innerHeight,top=30;const avail=vh-top-6;const s=Math.max(0.1,Math.min(vw/W,avail/H));const w=Math.floor(W*s),h=Math.floor(H*s);

  RS=Math.max(0.5,Math.min(3,s*Math.min(2,window.devicePixelRatio||1)));const bw=Math.round(W*RS),bh=Math.round(H*RS);if(cv.width!==bw||cv.height!==bh){cv.width=bw;cv.height=bh;bg=null;}}

const WP=[[-1,1],[2,1],[2,6],[6,6],[6,2],[10,2],[10,7],[13,7],[13,4],[16,4]];

const pathCells=new Set();
for(let i=0;i<WP.length-1;i++){const [a,b]=[WP[i],WP[i+1]];const dc=Math.sign(b[0]-a[0]),dr=Math.sign(b[1]-a[1]);let c=a[0],r=a[1];while(true){if(c>=0&&c<COLS)pathCells.add(c+','+r);if(c===b[0]&&r===b[1])break;c+=dc;r+=dr;}}
const SEG=[];let PATHLEN=0;for(let i=0;i<PATH.length-1;i++){const a=PATH[i],b=PATH[i+1],l=Math.hypot(b.x-a.x,b.y-a.y);SEG.push({a:a,b:b,l:l,s:PATHLEN});PATHLEN+=l;}
function posAt(d){for(const s of SEG){if(d<=s.s+s.l){const k=(d-s.s)/s.l;return {x:s.a.x+(s.b.x-s.a.x)*k,y:s.a.y+(s.b.y-s.a.y)*k,ang:Math.atan2(s.b.y-s.a.y,s.b.x-s.a.x)};}}const l=PATH[PATH.length-1];return {x:l.x,y:l.y,ang:0};}
const DECOR=[[0,4,'tree'],[1,7,'rock'],[4,3,'tree'],[8,8,'tree'],[8,0,'rock'],[11,5,'tree'],[15,0,'tree'],[15,8,'rock'],[4,8,'pond'],[14,6,'tree']];
const decoSet=new Set(DECOR.map(d=>d[0]+','+d[1]));
function hash(a,b){let h=(a*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177;return ((h^(h>>>16))>>>0)/4294967295;}

// ---------- state ----------
let state='menu',money=0,lives=0,wave=0,score=0,towers=[],enemies=[],projs=[],fx=[],parts=[],texts=[],spawnQ=[],spawnT=0,waveActive=false,speed=1,buildType=-1,selTower=null,hover=null,gameT=0,flashMsg='',flashT=0;
function hpScale(w){return 1+0.2*(w-1)+0.016*(w-1)*(w-1);}
function startGame(){money=220;lives=20;wave=0;score=0;towers=[];enemies=[];projs=[];fx=[];parts=[];texts=[];spawnQ=[];waveActive=false;speed=1;buildType=-1;selTower=null;state='play';hideOv();ghLive=true;ghEmit('start');}
function nextWave(){
  if(waveActive&&spawnQ.length)return;if(wave>=NW)return;
  if(waveActive){const bonus=10+wave*2;money+=bonus;texts.push({x:W/2,y:MY+40,s:'Gọi sớm +'+bonus+' vàng',t:1.2,col:'#ffd166'});}
  wave++;waveActive=true;spawnQ=[];let t=0.5;
  for(const [type,n,iv] of WAVES[wave-1]){for(let i=0;i<n;i++){spawnQ.push({t:t,type:type});t+=iv;}t+=1.2;}
  spawnQ.sort((a,b)=>a.t-b.t);spawnT=0;
  flashMsg='Đợt '+wave+'/'+NW;flashT=1.8;
}
function spawn(type){const d=ET[type],hp=Math.round(d.hp*hpScale(wave));enemies.push({type:type,d:0,hp:hp,maxHp:hp,spd:d.spd,armor:d.armor,slowF:0,slowT:0,flash:0,x:PATH[0].x,y:PATH[0].y,ang:0,t:Math.random()*5,fly:!!d.fly});}
function damage(e,dmg,pierce){if(e.dead)return;const real=Math.max(1,dmg-(pierce?0:e.armor));e.hp-=real;e.flash=0.08;if(e.hp<=0){e.dead=true;const rw=ET[e.type].reward;money+=rw;score+=rw*2;burst(e.x,e.y,ET[e.type].col,10);texts.push({x:e.x,y:e.y-10,s:'+'+rw,t:0.8,col:'#ffd166'});sfx('die',()=>SFX.die());fxDie(e);}}
function burst(x,y,col,n){n=Math.ceil(n*(fxHi?1.2:0.5));for(let i=0;i<n&&parts.length<PCAP();i++){const a=Math.random()*6.28,s=20+Math.random()*120;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.3+Math.random()*0.4,col:col});}}
function towerStats(t){return TT[t.type].lv[t.lv];}
function canBuild(c,r){if(c<0||r<0||c>=COLS||r>=ROWS)return false;const k=c+','+r;if(pathCells.has(k)||decoSet.has(k))return false;return !towers.some(t=>t.c===c&&t.r===r);}
function build(c,r){const tt=TT[buildType];if(!canBuild(c,r)){tone(120,0.1,'square',0.04);return;}if(money<tt.cost){msg('Không đủ vàng!');return;}
  money-=tt.cost;const t={type:buildType,c:c,r:r,x:c*TS+TS/2,y:MY+r*TS+TS/2,lv:0,cd:0,ang:-Math.PI/2,spent:tt.cost,kick:0};towers.push(t);burst(t.x,t.y,'#d9c9a0',10);
  selTower=null;if(money<tt.cost)buildType=-1;}
function upgrade(t){if(!t||t.lv>=2)return;const c=TT[t.type].lv[t.lv+1].cost;if(money<c){msg('Không đủ vàng!');return;}money-=c;t.spent+=c;t.lv++;burst(t.x,t.y,'#ffd166',16);}
function sell(t){if(!t)return;const v=Math.floor(t.spent*0.7);money+=v;towers=towers.filter(o=>o!==t);selTower=null;texts.push({x:t.x,y:t.y,s:'+'+v,t:0.9,col:'#ffd166'});SFX.sell();}
function msg(s){flashMsg=s;flashT=1.2;SFX.deny();}

function update(dt){
  gameT+=dt;
  if(waveActive){spawnT+=dt;while(spawnQ.length&&spawnQ[0].t<=spawnT)spawn(spawnQ.shift().type);}
  // enemies
  for(const e of enemies){
    if(e.dead)continue;e.t+=dt;if(e.flash>0)e.flash-=dt;
    if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slowF=0;}
    e.d+=e.spd*(1-e.slowF)*dt;const p=posAt(e.d);e.x=p.x;e.y=p.y;e.ang=p.ang;
    if(ET[e.type].heal){for(const o of enemies)if(!o.dead&&o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<70&&o.hp<o.maxHp){o.hp=Math.min(o.maxHp,o.hp+o.maxHp*0.05*dt);}}
    if(e.d>=PATHLEN){e.dead=true;e.leaked=true;lives-=ET[e.type].lives;fxLeak();flashMsg='-'+ET[e.type].lives+' mạng';flashT=0.8;
      if(lives<=0){lives=0;gameOver();return;}}
  }
  enemies=enemies.filter(e=>!e.dead);
  // towers
  for(const t of towers){
    const s=towerStats(t),tt=TT[t.type];t.cd-=dt;if(t.kick>0)t.kick-=dt;
    let target=null,bd=-1;
    for(const e of enemies){if(e.dead||(e.fly&&!tt.air))continue;if(Math.hypot(e.x-t.x,e.y-t.y)<=s.range&&e.d>bd){bd=e.d;target=e;}}
    if(target){t.ang=Math.atan2(target.y-t.y,target.x-t.x);
      if(t.cd<=0){t.cd=1/s.rate;t.kick=0.1;
        if(t.type===0){projs.push({k:'arrow',x:t.x,y:t.y,tg:target,spd:520,dmg:s.dmg});sfx('arrow',()=>SFX.arrow());}
        else if(t.type===1){const lead=posAt(target.d+target.spd*(1-target.slowF)*0.55);projs.push({k:'ball',x:t.x,y:t.y,sx:t.x,sy:t.y,tx:lead.x,ty:lead.y,t:0,dur:0.55,dmg:s.dmg,splash:s.splash});sfx('cannon',()=>SFX.cannon());}
        else if(t.type===2){projs.push({k:'ice',x:t.x,y:t.y,tg:target,spd:340,dmg:s.dmg,slow:s.slow,slowT:s.slowT,splash:s.splash});sfx('ice',()=>SFX.ice());}
        else{const hit=[target];let last=target;for(let i=1;i<s.chain;i++){let nb=null,nd=90;for(const e of enemies){if(e.dead||hit.includes(e))continue;const d=Math.hypot(e.x-last.x,e.y-last.y);if(d<nd){nd=d;nb=e;}}if(!nb)break;hit.push(nb);last=nb;}
          const pts=[{x:t.x,y:t.y-14}].concat(hit.map(e=>({x:e.x,y:e.y})));fx.push({k:'bolt',pts:pts,t:0.18});hit.forEach((e,i)=>damage(e,s.dmg*Math.pow(0.85,i),true));sfx('zap',()=>SFX.zap());}
      }}
  }
  // projectiles
  for(const p of projs){
    if(p.k==='ball'){p.t+=dt;const k=Math.min(1,p.t/p.dur);p.x=p.sx+(p.tx-p.sx)*k;p.y=p.sy+(p.ty-p.sy)*k-Math.sin(k*Math.PI)*40;
      if(k>=1){p.dead=true;fx.push({k:'boom',x:p.tx,y:p.ty,r:p.splash,t:0.3});burst(p.tx,p.ty,'#ffb347',10);sfx('boom',()=>SFX.boom());fxBoom(p.tx,p.ty,p.splash);
        for(const e of enemies)if(!e.dead&&!e.fly&&Math.hypot(e.x-p.tx,e.y-p.ty)<=p.splash)damage(e,p.dmg,false);}}
    else{const tg=p.tg;if(tg.dead&&!p.lx){p.lx=tg.x;p.ly=tg.y;}const tx=tg.dead?p.lx:tg.x,ty=tg.dead?p.ly:tg.y;const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);p.ang=Math.atan2(dy,dx);
      if(d<=p.spd*dt+4){p.dead=true;
        if(p.k==='arrow'){if(!tg.dead)damage(tg,p.dmg,false);}
        else{fx.push({k:'frost',x:tx,y:ty,r:p.splash,t:0.3});fxFrost(tx,ty,p.splash);for(const e of enemies){if(e.dead)continue;if(Math.hypot(e.x-tx,e.y-ty)<=p.splash){damage(e,p.dmg,false);if(!e.dead){e.slowF=Math.max(e.slowF,e.type==='boss'?p.slow*0.5:p.slow);e.slowT=p.slowT;}}}}}
      else{p.x+=dx/d*p.spd*dt;p.y+=dy/d*p.spd*dt;}}
  }
  projs=projs.filter(p=>!p.dead);
  for(const f of fx)f.t-=dt;fx=fx.filter(f=>f.t>0);
  for(const q of parts){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.9;q.vy*=0.9;}parts=parts.filter(q=>q.life>0);
  for(const t of texts){t.t-=dt;t.y-=24*dt;}texts=texts.filter(t=>t.t>0);
  if(flashT>0)flashT-=dt;
  // wave end
  if(waveActive&&!spawnQ.length&&!enemies.length){waveActive=false;ghEmit('milestone',{kind:'wave',value:wave});const bonus=25+wave*5;money+=bonus;score+=wave*100;texts.push({x:W/2,y:MY+80,s:'Hoàn thành đợt '+wave+'! +'+bonus+' vàng',t:2,col:'#7cf29a'});tone(523,0.1,'triangle',0.05);setTimeout(()=>tone(659,0.1,'triangle',0.05),100);setTimeout(()=>tone(784,0.2,'triangle',0.05),200);
    if(wave>=NW)win();}
}

// ---------- input ----------
function toCanvas(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
const BTN={tower:i=>({x:6+i*112,y:BY+8,w:106,h:52}),next:{x:458,y:BY+8,w:118,h:52},speed:{x:582,y:BY+8,w:52,h:52},
  up:{x:330,y:BY+8,w:130,h:52},sell:{x:466,y:BY+8,w:110,h:52},close:{x:582,y:BY+8,w:52,h:52}};
function inR(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
cv.addEventListener('pointermove',e=>{const p=toCanvas(e);hover=p.y>=MY&&p.y<BY?{c:Math.floor(p.x/TS),r:Math.floor((p.y-MY)/TS)}:null;if(e.pointerType!=='mouse')hover=null;});
cv.addEventListener('pointerleave',()=>{hover=null;});
cv.addEventListener('contextmenu',e=>{e.preventDefault();buildType=-1;selTower=null;});
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;e.preventDefault();if(e.button===2)return;const p=toCanvas(e);
  if(p.y>=BY){
    if(selTower){if(inR(p,BTN.up))upgrade(selTower);else if(inR(p,BTN.sell))sell(selTower);else if(inR(p,BTN.close))selTower=null;return;}
    for(let i=0;i<4;i++)if(inR(p,BTN.tower(i))){buildType=buildType===i?-1:i;if(buildType>=0&&money<TT[i].cost){msg('Không đủ vàng!');}tone(600,0.04,'square',0.03);return;}
    if(inR(p,BTN.next)){nextWave();return;}
    if(inR(p,BTN.speed)){speed=speed===1?2:speed===2?3:1;tone(500,0.04,'square',0.03);return;}
    return;
  }
  if(p.y<MY)return;
  const c=Math.floor(p.x/TS),r=Math.floor((p.y-MY)/TS);
  const t=towers.find(o=>o.c===c&&o.r===r);
  if(t){selTower=selTower===t?null:t;buildType=-1;tone(700,0.03,'square',0.03);return;}
  if(buildType>=0){build(c,r);return;}
  selTower=null;
});
window.addEventListener('keydown',e=>{
  if(e.code==='Space')e.preventDefault();
  if(e.code==='KeyP'||e.code==='Escape'){if(state==='play'){if(e.code==='Escape'&&(buildType>=0||selTower)){buildType=-1;selTower=null;return;}pause();}else if(state==='pause')resume();return;}
  if(e.code==='KeyM'){muted=!muted;save('thu_mute',muted);}
  if(e.code==='Enter'){const b=ov.querySelector('[data-def]');if(ov.style.display!=='none'&&b){b.click();return;}}
  if(state!=='play')return;
  if(/^Digit[1-4]$/.test(e.code)){const i=+e.code[5]-1;buildType=buildType===i?-1:i;selTower=null;}
  if(e.code==='Space'||e.code==='KeyN')nextWave();
  if(e.code==='KeyF'){speed=speed===1?2:speed===2?3:1;}
  if(e.code==='KeyU')upgrade(selTower);
  if(e.code==='KeyS'||e.code==='Delete')sell(selTower);
});
window.addEventListener('blur',()=>{if(state==='play')pause();});
pauseBtn.addEventListener('click',()=>{if(state==='play')pause();else if(state==='pause')resume();});

function recordBest(won){const s=finalScore();let rec=false;if(s>best.score){best.score=s;rec=true;}if(wave>best.wave)best.wave=wave;if(won)best.won=true;save('thu_best',best);return rec;}
function endStats(){return `<div class="stats"><div class="st"><b>${wave}/${NW}</b><small>Đợt</small></div><div class="st"><b>${lives}</b><small>Mạng còn</small></div><div class="st"><b>${towers.length}</b><small>Tháp</small></div><div class="st hl"><b data-count="${finalScore()}">${finalScore()}</b><small>Điểm</small></div></div>`;}
function gameOver(){state='over';const rec=recordBest(false);ghEnd(false,rec);tone(200,0.6,'sawtooth',0.06,-150);
  showOv(`<span class="kicker">Cổng thành đã vỡ</span><h1>🏚 Thành đã thất thủ!</h1><p>Bạn trụ được tới đợt <b>${wave}/${NW}</b>.</p>${rec?'<span class="newrec">KỶ LỤC MỚI!</span>':''}${endStats()}<p class="rec"><span>Kỷ lục: <b>${best.score}</b></span><span>Đợt xa nhất: <b>${best.wave}</b></span></p><button class="btn" data-a="new" data-def>Chơi lại</button><button class="btn s" data-a="menu">Màn hình chính</button>`);}
function win(){state='win';const rec=recordBest(true);ghEnd(true,rec);SFX.win();
  showOv(`<span class="kicker">Vương quốc được bảo vệ</span><h1>🏰 Thủ thành thành công!</h1><p>Bạn đã đẩy lùi toàn bộ ${NW} đợt tấn công với <b>${lives}</b> mạng còn lại.</p>${rec?'<span class="newrec">KỶ LỤC MỚI!</span>':''}${endStats()}<p class="sub">Điểm gồm +${lives*50} thưởng mạng</p><p class="rec"><span>Kỷ lục: <b>${best.score}</b></span></p><button class="btn" data-a="new" data-def>Chơi lại</button><button class="btn s" data-a="menu">Màn hình chính</button>`);}
function pause(){state='pause';showOv(`<span class="kicker">Đợt ${wave}/${NW}</span><h2>Tạm dừng</h2><div class="stats"><div class="st"><b>${lives}</b><small>Mạng</small></div><div class="st hl"><b>${money}</b><small>Vàng</small></div><div class="st"><b>${towers.length}</b><small>Tháp</small></div><div class="st"><b>${score}</b><small>Điểm</small></div></div><button class="btn" data-a="resume" data-def>Tiếp tục</button><button class="btn s" data-a="restart">Chơi lại từ đầu</button><button class="btn s" data-a="menu">Màn hình chính</button>${settingsHTML()}`);}
function resume(){state='play';hideOv();}
function menu(){state='menu';showOv(`<span class="kicker">Thủ thành · ${NW} đợt tấn công</span><span class="logo">🏰 Thủ Thành</span><p>Quân địch kéo đến theo con đường mòn. Xây tháp dọc hai bên đường để chặn ${NW} đợt tấn công — đừng để chúng lọt vào thành!</p>

<p class="rec"><span>Kỷ lục: <b>${best.score}</b></span><span>Đợt xa nhất: <b>${best.wave}</b>${best.won?' · 🏆 Đã thắng':''}</span></p><button class="btn" data-a="new" data-def>▶ Bắt đầu</button>${settingsHTML()}`);}
let curPanel=null;
function showOv(h){ov.innerHTML='<div class="panel">'+h+'</div>';ov.style.display='flex';pauseBtn.style.display='none';curPanel=state;animCounters();}
function hideOv(){ov.style.display='none';pauseBtn.style.display='block';}
function refreshPanel(){if(curPanel==='pause')pause();else if(curPanel==='menu')menu();}
ov.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;SFX.ui();
  if(a==='new'||a==='restart'){ghEnd(false,false);startGame();}else if(a==='resume')resume();else if(a==='menu'){if(state==='pause')ghEnd(false,recordBest(false));menu();}
  else if(a==='mute'){muted=!muted;save('thu_mute',muted);refreshPanel();}
  else if(a==='music'){musicOn=!musicOn;save('thu_music',musicOn);refreshPanel();}
  else if(a==='fx'){fxHi=!fxHi;save('thu_fx',fxHi?'hi':'lo');bg=null;refreshPanel();}});

  {const ex=COLS*TS-14,ey=MY+4*TS+TS/2;ctx.strokeStyle=OLT;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(ex,ey-18);ctx.lineTo(ex,ey-40);ctx.stroke();ctx.fillStyle='#d94a4a';ctx.beginPath();ctx.moveTo(ex,ey-40);for(let i=0;i<=5;i++)ctx.lineTo(ex-i*2.4,ey-40+Math.sin(realT*5+i)*1.4);ctx.lineTo(ex-12,ey-32+Math.sin(realT*5+5)*1.4);for(let i=5;i>=0;i--)ctx.lineTo(ex-i*2.4,ey-32+Math.sin(realT*5+i)*1.4);ctx.fill();

      ctx.fillStyle=ok?'rgba(124,242,154,.28)':'rgba(255,80,80,.32)';rrect(ctx,hover.c*TS+1,MY+hover.r*TS+1,TS-2,TS-2,6);ctx.fill();if(ok){showRange(g);ctx.globalAlpha=0.6;drawTower(g,true);ctx.globalAlpha=1;}}
  }

  for(const p of projs){if(p.k==='arrow'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang||0);ctx.strokeStyle='rgba(255,240,200,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-16,0);ctx.lineTo(-6,0);ctx.stroke();ctx.fillStyle='#6a4a2a';ctx.fillRect(-8,-1,13,2);ctx.fillStyle='#d8dce4';ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(4,-2.5);ctx.lineTo(4,2.5);ctx.fill();ctx.fillStyle='#e8e0d0';ctx.fillRect(-9,-2.5,3,1.5);ctx.fillRect(-9,1,3,1.5);ctx.restore();}
    else if(p.k==='ball'){const k=Math.min(1,p.t/p.dur),gx=p.sx+(p.tx-p.sx)*k,gy=p.sy+(p.ty-p.sy)*k;ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(gx,gy+4,4,2,0,0,7);ctx.fill();ctx.fillStyle='#1a1a1e';ctx.beginPath();ctx.arc(p.x,p.y,5.5,0,7);ctx.fill();ctx.fillStyle='#5a5a64';ctx.beginPath();ctx.arc(p.x-1.6,p.y-1.6,2,0,7);ctx.fill();}
    else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate((p.ang||0)+realT*8);ctx.globalCompositeOperation='lighter';glow(ctx,'170,225,255',0.85,0,0,11);ctx.globalCompositeOperation='source-over';ctx.fillStyle='#e8f8ff';ctx.beginPath();ctx.moveTo(0,-5);ctx.lineTo(3,0);ctx.lineTo(0,5);ctx.lineTo(-3,0);ctx.closePath();ctx.fill();ctx.restore();}}
  for(const f of fx){if(f.k==='bolt'){const a=f.t/0.18;ctx.globalCompositeOperation='lighter';for(const [lw,col] of [[7,'rgba(160,110,255,'+a*0.35+')'],[3,'rgba(220,200,255,'+a+')'],[1.2,'rgba(255,255,255,'+a+')']]){ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();for(let i=0;i<f.pts.length-1;i++){const p0=f.pts[i],p1=f.pts[i+1];ctx.moveTo(p0.x,p0.y);for(let k=1;k<=5;k++){const q=k/5;ctx.lineTo(p0.x+(p1.x-p0.x)*q+(k<5?(hash(k+i*7,Math.floor(realT*30))-0.5)*14:0),p0.y+(p1.y-p0.y)*q+(k<5?(hash(i*5+k,Math.floor(realT*30)+3)-0.5)*14:0));}}ctx.stroke();}
      for(const p of f.pts.slice(1))glow(ctx,'210,190,255',a*0.8,p.x,p.y,18);ctx.globalCompositeOperation='source-over';}

    else{const k=1-f.t/0.3;ctx.fillStyle='rgba(170,230,255,'+(1-k)*0.45+')';ctx.beginPath();ctx.arc(f.x,f.y,f.r*(0.6+k*0.4),0,7);ctx.fill();ctx.strokeStyle='rgba(230,250,255,'+(1-k)+')';ctx.lineWidth=2;ctx.stroke();}}
  for(const q of parts){ctx.globalAlpha=Math.min(1,q.life*3);ctx.fillStyle=q.col;ctx.fillRect(q.x-2,q.y-2,q.sz||4,q.sz||4);}ctx.globalAlpha=1;
  for(const p of vfx){const k=p.t/p.life;

function musicWanted(){return state==='play'||state==='menu'||state==='pause';}

function songStep(S,s,t,spb){const bar=Math.floor(s/16)%4,st=s%16,deg=S.prog[bar],ch=[0,2,4].map(i=>S.key+sdeg(S,deg+i));const war=state==='play'&&waveActive;
